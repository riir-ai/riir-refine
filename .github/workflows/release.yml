# ─────────────────────────────────────────────────────────────────────────────
# Proposal 003 / Plan 105 — binary-only release pipeline.
#
# Tag push `v*` → 5-target matrix build → leak scan → SHA256SUMS + license
# doc → `gh release create` on the PUBLIC dist repo (gist-rs/cargo-heal) →
# Formula / scoop-manifest bump PRs. workflow_dispatch is a DRY RUN:
# identical build + scan + packaging, no publish, no PRs.
#
# Secrets (both must fail LOUD when absent — the expiry-alarm rule):
#   SIBLING_REPOS_TOKEN — fine-grained PAT cloning riir-ai/riir-ai +
#                         riir-ai/riir-neuron-db + riir-ai/riir-kat (a
#                         NON-optional root dep since the 09-10 issue-088
#                         spin-out) + riir-ai/riir-auth (riir-kat's
#                         transitive) + riir-ai/riir-llm (issue 124,
#                         optional but resolved) + riir-ai/riir-infer (the
#                         09-22 carve, riir-ai Issue 998 — riir-ai's
#                         riir-engine/riir-gpu escape to it transitively;
#                         cargo reads path-dep manifests even behind
#                         `optional = true`) — the same secret rust.yml
#                         already uses; the workspace cannot resolve without
#                         those siblings — path deps + [patch] sections).
#   RELEASE_PAT         — fine-grained PAT, repository access = the three
#                         PUBLIC source-free dist repos ONLY (cargo-refine,
#                         homebrew-tap, scoop-bucket), contents + pull_requests
#                         read/write (pull_requests is required by `gh pr create`
#                         on the formula/manifest bump steps). Publishes the
#                         release and opens the tap/bucket PRs.
#
# Deliberate deviations, recorded in Plan 105 (do not "fix" them here):
#   * No --locked: Cargo.lock is gitignored in this repo (floating siblings
#     churn it — see rust.yml's cache note). SHA256SUMS is the pin.
#   * Linux musl rows get their toolchain from
#     taiki-e/setup-cross-toolchain-action (zig-based linker + C compiler env),
#     then build with PLAIN cargo — `cross` the tool cannot see the
#     ../katgpt-rs-style sibling path deps (it mounts only the project dir),
#     and a raw zig download 404'd on the runners (measured, run 34072493969).
#   * RUSTFLAGS --remap-path-prefix is REQUIRED, not optional (the proposal's
#     word): the unremapped binary measured 61 absolute build-machine paths.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: cargo-refine
  DIST_REPO: gist-rs/cargo-refine
  TAP_REPO: gist-rs/homebrew-tap
  BUCKET_REPO: gist-rs/scoop-bucket

jobs:
  # ── THIRD_PARTY_LICENSES.md from the shipping feature set ──────────────────
  # cargo-about resolves the same workspace the build jobs resolve (it runs
  # cargo metadata), so it needs the same sibling layout. The about.toml
  # `targets` table pins this to exactly the five release triples. Generation
  # FAILS on any license outside the accepted list — that is the G4 gate.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Check out katgpt-rs (public, develop)
        uses: actions/checkout@v6
        with:
          repository: katopz/katgpt-rs
          ref: develop
          path: sibling/katgpt-rs

      - name: Check out private siblings + arrange the layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_TOKEN:-}" ]; then
            echo "::error title=SIBLING_REPOS_TOKEN missing::The workspace cannot resolve without riir-ai + riir-neuron-db + riir-kat (+ its transitive riir-auth) + riir-llm + riir-infer (the carve, riir-ai Issue 998). Set/renew the secret (a fine-grained PAT expires ~90 days)."
            exit 1
          fi
          for repo in riir-ai riir-neuron-db riir-kat riir-auth riir-llm riir-infer; do
            git clone --depth 1 \
              "https://x-access-token:${SIBLING_TOKEN}@github.com/gist-rs/${repo}.git" \
              "sibling/${repo}"
          done
          mv sibling/* ..
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}

      - name: Install cargo-about (pinned — its config schema has drifted across minors)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate THIRD_PARTY_LICENSES.md (fails on any non-accepted license)
        run: |
          cargo about generate --config .github/about/about.toml \
            --features latent_retrieval,points,net-mainnet,fix_verify,kernel_pregate,shader_perf .github/about/about.hbs \
            > THIRD_PARTY_LICENSES.md

      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  # ── The 5-target build matrix ───────────────────────────────────────────────
  # musl rows: setup-cross-toolchain-action, then plain cargo (see the header
  # note). macOS x86_64 is a cross-compile from the arm runner (same OS —
  # plain cargo handles it).
  # RUSTFLAGS is a per-row string because each host layout needs its own
  # remap prefix (windows carries both slash conventions).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            remap: --remap-path-prefix /Users/runner=/build
          - target: x86_64-apple-darwin
            os: macos-14
            remap: --remap-path-prefix /Users/runner=/build
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            remap: --remap-path-prefix /home/runner=/build
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            remap: --remap-path-prefix /home/runner=/build
            cross: true
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            remap: --remap-path-prefix /home/runner=/build
            # gnu not msvc: the standing manual-release mode builds the windows
            # target via cargo-zigbuild from the M3 (gnu is the zigbuild-able
            # spelling; every shipped windows asset to date is -gnu). Matching
            # the CI matrix to the artifacts we actually ship keeps the scoop
            # manifest's URL arm and the SHA256SUMS names one truth.
            cross: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.remap }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install

      - name: Add the build target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # Plan 298 T2.5: embed the resolved dependency tree in the shipped
      # binaries (the AUDITABLE_VERSION_INFO data section) so `cargo audit
      # bin`-class scanners can attribute vulnerable deps in the DIST
      # artifacts without the source tree. Prebuilt via install-action.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - name: Set up the musl cross toolchain (musl rows only)
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Check out katgpt-rs (public, develop)
        uses: actions/checkout@v6
        with:
          repository: katopz/katgpt-rs
          ref: develop
          path: sibling/katgpt-rs

      - name: Check out private siblings + arrange the layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_TOKEN:-}" ]; then
            echo "::error title=SIBLING_REPOS_TOKEN missing::The workspace cannot resolve without riir-ai + riir-neuron-db + riir-kat (+ its transitive riir-auth) + riir-llm + riir-infer (the carve, riir-ai Issue 998). Set/renew the secret (a fine-grained PAT expires ~90 days)."
            exit 1
          fi
          for repo in riir-ai riir-neuron-db riir-kat riir-auth riir-llm riir-infer; do
            git clone --depth 1 \
              "https://x-access-token:${SIBLING_TOKEN}@github.com/gist-rs/${repo}.git" \
              "sibling/${repo}"
          done
          mv sibling/* ..
        env:
          SIBLING_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}

      # Shipping feature set = the CHARITABLE set (Issue 192 / Plan 325, owner
      # posture act 2026-11-03): default + latent_retrieval + points (the
      # public-goods surface — implies the join identity chain via riir-kat
      # client + provider_login) + fix_verify + update_check. The KAT billing
      # plane (kat_service/kat_transport) stays OUT — the T14 charitable sweep
      # holds its hard-zero KAT classes; Refine is mainnet-only, no devnet
      # lane ships. NEVER ternary_inference.
      # fix_verify joins at v0.1.4 (2026-09-09): the docs promise `--fix`
      # compile-gates, and a shipped binary without the gate both breaks that
      # promise AND records every fix as unverified (Heuristic tier) — which
      # the contribution pipeline then cannot treat as strong evidence.
      # points joins at v0.4.0 (2026-11-03): join/leave/rank/corpus + the
      # client UUID + first-run consent + offline; adds ureq via the existing
      # TLS stack (already license-accepted through the kat_transport era)
      # and riir-ledger (MIT OR Apache-2.0, our own wire leaf).
      # Build with --profile dist (size-optimized, Cargo.toml [profile.dist]):
      # measured 2026-09-09, 11.0 MB → 4.3 MB (-61%) on the arm64 shipping set.
      # Dev-time builds stay on plain --release (drafter speed); the shipped
      # artifact optimizes for download size. panic=abort is safe here: the
      # only catch_unwind strings in the tree are sec-domain proposer TEXT.
      # `cargo auditable build` (Plan 298 T2.5) is a pass-through wrapper —
      # same flags, plus the dependency info embedded for scanners.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo auditable build --profile dist --target ${{ matrix.target }} \
            --features latent_retrieval,points,net-mainnet,fix_verify,update_check,kernel_pregate,shader_perf --bin cargo-refine

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/cargo-refine
            target/${{ matrix.target }}/dist/cargo-refine.exe
          if-no-files-found: error

  # ── Package + the G2 gate ───────────────────────────────────────────────────
  # Archives carry the binary + THIRD_PARTY_LICENSES.md (G4: licenses in
  # every archive). The leak scan runs on the RAW binaries and fails the job
  # BEFORE anything could be published.
  package:
    needs: [licenses, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage, archive, checksum
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-dryrun}"
          cp artifacts/licenses/THIRD_PARTY_LICENSES.md .
          mkdir -p dist
          for d in artifacts/bin-*/; do
            target="$(basename "$d")"
            target="${target#bin-}"
            stage="stage/$target"
            mkdir -p "$stage"
            if [ -f "$d/cargo-refine" ]; then
              cp "$d/cargo-refine" "$stage/cargo-refine"
            elif [ -f "$d/cargo-refine.exe" ]; then
              cp "$d/cargo-refine.exe" "$stage/cargo-refine.exe"
            else
              echo "::error::no cargo-refine binary in $d"
              exit 1
            fi
            cp THIRD_PARTY_LICENSES.md "$stage/THIRD_PARTY_LICENSES.md"
            cp release/LICENSE.md "$stage/LICENSE.md"
            if [ -f "$stage/cargo-refine.exe" ]; then
              (cd "$stage" && zip -q "../../dist/cargo-refine-${TAG}-${target}.zip" cargo-refine.exe LICENSE.md THIRD_PARTY_LICENSES.md)
            else
              tar -czf "dist/cargo-refine-${TAG}-${target}.tar.gz" -C "$stage" cargo-refine LICENSE.md THIRD_PARTY_LICENSES.md
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          cp THIRD_PARTY_LICENSES.md dist/
          cp release/LICENSE.md dist/LICENSE.md
          ls -la dist/

      - name: Binary size gate (ceiling, fires upward only — see script header)
        shell: bash
        run: |
          set -euo pipefail
          bins=""
          for d in artifacts/bin-*/; do
            for b in "$d/cargo-refine" "$d/cargo-refine.exe"; do
              [ -f "$b" ] && bins="$bins $b"
            done
          done
          ./scripts/binary_size_gate.sh $bins

      - name: Leak scan (Proposal 003 G2 — fails the job before publish)
        shell: bash
        run: |
          set -euo pipefail
          bins=""
          for d in artifacts/bin-*/; do
            for b in "$d/cargo-refine" "$d/cargo-refine.exe"; do
              [ -f "$b" ] && bins="$bins $b"
            done
          done
          ./scripts/binary_leak_scan.sh $bins

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ── Publish (tag pushes ONLY — dispatch is always a dry run) ────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the release on the public dist repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=RELEASE_PAT missing::Publishing requires the robot PAT (Plan 105 T1.3: fine-grained, the three public dist repos only)."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          notes="Prebuilt cargo-refine binaries for ${TAG}. Verify with SHA256SUMS; dependency attributions in THIRD_PARTY_LICENSES.md. Install: see README."
          if gh release view "$TAG" -R "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$DIST_REPO" --clobber dist/*
          else
            gh release create "$TAG" -R "$DIST_REPO" --title "cargo-refine ${TAG}" --notes "$notes" dist/*
          fi

      # Manifest bumps go out as PRs — a human merges after eyeballing the
      # hashes against SHA256SUMS (the tamper discipline, Proposal 003 §risks).
      - name: Bump the Homebrew formula (PR)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${DIST_REPO}/releases/download/${TAG}"
          arm_sha=$(awk -v f="cargo-refine-${TAG}-aarch64-apple-darwin.tar.gz" '$2==f{print $1}' dist/SHA256SUMS)
          intel_sha=$(awk -v f="cargo-refine-${TAG}-x86_64-apple-darwin.tar.gz" '$2==f{print $1}' dist/SHA256SUMS)
          linux_arm_sha=$(awk -v f="cargo-refine-${TAG}-aarch64-unknown-linux-musl.tar.gz" '$2==f{print $1}' dist/SHA256SUMS)
          linux_sha=$(awk -v f="cargo-refine-${TAG}-x86_64-unknown-linux-musl.tar.gz" '$2==f{print $1}' dist/SHA256SUMS)
          for sha in "$arm_sha" "$intel_sha" "$linux_arm_sha" "$linux_sha"; do
            if [ -z "$sha" ]; then
              echo "::error::a macOS/Linux hash is missing from SHA256SUMS — refusing to write a broken formula"
              exit 1
            fi
          done
          mkdir -p Formula
          cat > Formula/cargo-refine.rb <<EOF
          # Manifest-only formula for the binary-only cargo-refine distribution
          # (Proposal 003). Generated by the release pipeline — do not edit by hand.
          class CargoRefine < Formula
            desc "Modelless code healer: clippy, rust perf, kernel, docker, rustc-error fixes"
            homepage "https://github.com/${DIST_REPO}"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/cargo-refine-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_sha}"
              else
                url "${BASE}/cargo-refine-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_sha}"
              end
            end
            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/cargo-refine-${TAG}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${linux_arm_sha}"
              else
                url "${BASE}/cargo-refine-${TAG}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${linux_sha}"
              end
            end

            def install
              bin.install "cargo-refine"
            end
          end
          EOF
          # A PR needs common history with main — clone it and branch off.
          # `git init` makes an orphan branch; GitHub rejects that PR with
          # "no history in common" (measured, run 34081938353).
          git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp Formula/cargo-refine.rb tap/Formula/cargo-refine.rb
          cd tap
          git config user.name "cargo-refine-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b "release/${TAG}"
          git add Formula/cargo-refine.rb
          git commit -qm "cargo-refine ${TAG}"
          git push -q -f origin "HEAD:refs/heads/release/${TAG}"
          gh pr create -R "$TAP_REPO" --head "release/${TAG}" --base main \
            --title "cargo-refine ${TAG}" \
            --body "Automated formula bump from the release pipeline (Plan 105 T2.4). Verify the sha256 lines against the release's SHA256SUMS, then merge."

      - name: Bump the Scoop manifest (PR)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          win_sha=$(awk -v f="cargo-refine-${TAG}-x86_64-pc-windows-gnu.zip" '$2==f{print $1}' dist/SHA256SUMS)
          if [ -z "$win_sha" ]; then
            echo "::error::the windows hash is missing from SHA256SUMS — refusing to write a broken manifest"
            exit 1
          fi
          mkdir -p bucket
          cat > "bucket/cargo-refine.json" <<EOF
          {
              "version": "${VERSION}",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/${DIST_REPO}/releases/download/${TAG}/cargo-refine-${TAG}-x86_64-pc-windows-gnu.zip",
                      "hash": "${win_sha}"
                  }
              },
              "bin": ["cargo-refine.exe"],
              "checkver": "github"
          }
          EOF
          git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${BUCKET_REPO}.git" bucket_repo
          mkdir -p bucket_repo/bucket
          cp "bucket/cargo-refine.json" "bucket_repo/bucket/cargo-refine.json"
          cd bucket_repo
          git config user.name "cargo-refine-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b "release/${TAG}"
          git add "bucket/cargo-refine.json"
          git commit -qm "cargo-refine ${TAG}"
          git push -q -f origin "HEAD:refs/heads/release/${TAG}"
          gh pr create -R "$BUCKET_REPO" --head "release/${TAG}" --base main \
            --title "cargo-refine ${TAG}" \
            --body "Automated manifest bump from the release pipeline (Plan 105 T2.4). Verify the hash against the release's SHA256SUMS, then merge."
