# ─────────────────────────────────────────────────────────────────────────────
# ops-dashboard-nightly — Issue 044 T7
#
# Nightly unattended run of `python3 scripts/gen_dashboard.py --sweep`
# (healer-coverage re-measure across the 11 sibling repos) + commit of the
# refreshed artifacts + conditional redeploy of the CF dashboard Worker.
#
# INERT BY DEFAULT. The job is guarded on the repository variable
# OPS_DASHBOARD_ENABLED == 'true'. Until the owner sets it, scheduled runs
# skip the job entirely — no nightly failure spam from missing secrets.
#
# Owner enablement (one-time):
#   1. Settings → Secrets and variables → Actions → Variables:
#        OPS_DASHBOARD_ENABLED = true
#   2. Settings → Secrets and variables → Actions → Secrets:
#        SIBLING_REPOS_TOKEN  — read-only PAT for the private riir-ai/* sibling
#                               checkouts (the SAME secret rust.yml uses; the
#                               retired GH_PAT was a second, unrotated copy —
#                               one read-only sibling token everywhere, 2026-10-25)
#        CLOUDFLARE_OPS_API_TOKEN         — Cloudflare token with Analytics:Read (GraphQL;
#                               the same token the housekeeping worker uses).
#                               Feeds the CF daily-neurons + containers sections.
#                               ONE name everywhere: repo secret = process env =
#                               the local .env var = the Worker secret binding.
#        CLOUDFLARE_API_TOKEN — Cloudflare token permitted to deploy the
#                               `riir-ops-dashboard` Worker. The deploy step
#                               soft-skips when unset.
#
# Scheduling note: scheduled workflows only run from the repo's DEFAULT
# branch. DEFAULT IS `main` (flipped 2026-08-29 to match every sibling repo
# and the deploy policy: prod deploys ship from main only — see
# scripts/ops_nightly.sh §3b; `develop` stays the working branch). This file
# must stay on the default branch or the schedule dies silently.
#
# ── Generator dependencies: BOTH LANDED (verified 2026-08-28, T13) ──────────
# The two assumptions this workflow was authored against are no longer
# assumptions — `scripts/gen_dashboard.py` now has both env overrides:
#   a) RIIR_GIT_ROOT — gen_dashboard.py:71
#        GIT_ROOT = Path(os.environ.get("RIIR_GIT_ROOT", "/Users/katopz/git"))
#      The scaffold step's `sudo ln -sfn $GITROOT /Users/katopz/git` belt-and-
#      braces fallback is therefore REMOVED: writing into a fabricated
#      /Users/katopz on a Linux runner (as root) was only ever needed by the
#      hardcoded path, and a sudo mkdir for a dead code path is pure risk.
#   b) CLOUDFLARE_OPS_API_TOKEN — gen_dashboard.py, env wins over the wrangler OAuth
#      file. The workflow therefore no longer needs to FABRICATE a macOS
#      wrangler config from the secret; it reads the CLOUDFLARE_OPS_API_TOKEN repo
#      secret straight into the same-named env var.
#
# ── ⚠ THIS CI PATH IS THE FALLBACK, NOT THE PRIMARY (decision, T13) ─────────
# The M3 is the correct home for the nightly refresh; see
# `scripts/ops_nightly.sh`. Measured/structural reasons:
#   * ZERO secrets. Locally the 11 repos are already checked out, cargo-refine is
#     already installed, and wrangler OAuth already authenticates — so
#     the SIBLING_REPOS_TOKEN / CLOUDFLARE_OPS_API_TOKEN / CLOUDFLARE_API_TOKEN repo secrets are all unnecessary. This
#     CI path cannot run at all until an owner provisions three credentials.
#   * ~5 min vs ~30-50. The local sweep is ~30-60 s per large repo (from the
#     coverage cache's own measured_at deltas: riir-ai 57 s, riir-train 35 s).
#     CI additionally pays 11 × fetch-depth-2000 clones + a release build of
#     cargo-refine.
#   * CI STRUCTURALLY produces a degraded dashboard: `.refine/trajectories.kv`
#     is gitignored local state, so the self-evolve adoption section is always
#     empty on a fresh checkout (admitted in the note below). That is a whole
#     card the CI run can never fill and the M3 always can.
#   * A nightly bot commit+push to `develop` races the concurrent agents that
#     work in this repo continuously.
# Keep this workflow as the disaster-recovery / owner-activated path.
#
# ── Nightly-parity gates (2026-09-01, closes the 044 T15 remaining gap) ─────
# The CI path historically did NOT go through scripts/ops_nightly.sh and
# drifted: unpinned wrangler (the nightly pins for the unpinned-remote-code-
# with-deploy-creds reason), the T17 artifact gap (corpus_history.jsonl was
# never committed by CI — every run dropped that day's corpus-series row),
# verify_dom sitting AFTER the commit (the nightly refuses to commit an
# unverified HTML), and no T16.2 post-deploy verification. All four are now
# mirrored here. Remaining CI-only degradations are structural (documented
# above): the adoption card stays empty (gitignored local state) and the
# run is slow.
#
# Layout: siblings are checked out to ${{ runner.temp }}/git/<name> (the same
# /git/<name> shape as the dev boxes — the generator's REPOS list resolves
# naturally inside it, including sibling-internal `../..` path deps), then
# symlinked beside the workspace so riir-refine's OWN cargo path deps
# (`../katgpt-rs/...`, `../riir-ai/...`, `../riir-neuron-db`, and the
# [patch.crates-io] ../riir-ai/vendor/* entries) resolve from
# $GITHUB_WORKSPACE.
#
# fetch-depth is 2000 (NOT 1) because the dashboard's git-cadence source
# runs `git log --since=30.days` per repo — a depth-1 clone would undercount
# it. Known limitation: >2000 commits in 30d undercounts a repo's cadence.
#
# Known CI limitation: `.refine/trajectories.kv` stores are gitignored local
# state, so the trajectory-adoption section will be empty on fresh checkouts
# (it degrades gracefully; coverage + git cadence + ledger sections carry the
# run).
# ─────────────────────────────────────────────────────────────────────────────

name: ops-dashboard-nightly

on:
  # SCHEDULE SUSPENDED (owner call 2026-09-09): scheduling belongs to the
  # service/app layer at Cloudflare (DO alarms + worker cron triggers), not
  # GitHub CI/CD — and this job was already the FALLBACK, not the primary
  # (the M3 launchd nightly, scripts/ops_nightly.sh, runs it with zero
  # Actions minutes). It was also INERT (OPS_DASHBOARD_ENABLED unset → the
  # job skipped every night at zero cost). workflow_dispatch keeps the
  # disaster-recovery path. Re-add to re-enable:
  # schedule:
  #   - cron: "23 18 * * *" # nightly, off the top of the hour (UTC)
  workflow_dispatch:

jobs:
  nightly:
    # INERT until the owner sets OPS_DASHBOARD_ENABLED=true (+ the secrets
    # documented in the header). vars context is available on schedule events.
    if: ${{ vars.OPS_DASHBOARD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # push the refreshed dashboard artifacts
    concurrency:
      group: ops-dashboard-nightly
      cancel-in-progress: false

    steps:
      - name: Preflight (config sanity — warnings only, never fatal)
        env:
          SIBLING_TOKEN_SET: ${{ secrets.SIBLING_REPOS_TOKEN != '' }}
          CF_API_SET: ${{ secrets.CLOUDFLARE_OPS_API_TOKEN != '' }}
          CF_DEPLOY_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          [ "${SIBLING_TOKEN_SET}" = "true" ] || echo "::warning::SIBLING_REPOS_TOKEN not set — private sibling checkouts will fail (coverage for those repos will be skipped)"
          [ "${CF_API_SET}" = "true" ] || echo "::warning::CLOUDFLARE_OPS_API_TOKEN secret not set — CF analytics sections will be empty"
          [ "${CF_DEPLOY_SET}" = "true" ] || echo "::warning::CLOUDFLARE_API_TOKEN not set — Worker deploy will be skipped"

      - name: Checkout riir-refine
        uses: actions/checkout@v6
        with:
          # 30d of history: the generator greps `git log --since=30.days`
          fetch-depth: 2000

      # ── Sibling checkouts (the generator's REPOS list minus riir-refine) ──
      # continue-on-error: a missing/paused repo must not kill the run — the
      # generator degrades per-source and the sweep skips absent dirs.
      # EXCEPTION: the cargo build hard-requires katgpt-rs + riir-ai
      # (non-optional ../katgpt-rs/crates/katgpt-core path dep + the
      # [patch.crates-io] ../riir-ai/vendor/* entries), so those two failing
      # still fails the build step below.
      - name: Checkout katgpt-rs (public)
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: katopz/katgpt-rs
          ref: develop
          path: ${{ runner.temp }}/git/katgpt-rs
          fetch-depth: 2000

      - name: Checkout riir-ai
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-ai
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-ai
          fetch-depth: 2000

      - name: Checkout riir-train (develop — default since 2026-09-04, was main)
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-train
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-train
          fetch-depth: 2000

      - name: Checkout riir-neuron-db
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-neuron-db
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-neuron-db
          fetch-depth: 2000

      - name: Checkout riir-chain
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-chain
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-chain
          fetch-depth: 2000

      - name: Checkout riir-game-sdk
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-game-sdk
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-game-sdk
          fetch-depth: 2000

      - name: Checkout riir-mmorpg-examples
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-mmorpg-examples
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-mmorpg-examples
          fetch-depth: 2000

      - name: Checkout riir-viewbridge
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-viewbridge
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-viewbridge
          fetch-depth: 2000

      - name: Checkout riir-dapps
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: riir-ai/riir-dapps
          ref: develop
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          path: ${{ runner.temp }}/git/riir-dapps
          fetch-depth: 2000

      # Runs AFTER the checkouts so the symlink targets exist (no dangling
      # links) and the post-step `ls` reflects the real sibling inventory.
      - name: Scaffold /git layout (GIT_ROOT mapping + cargo path deps)
        run: |
          set -euo pipefail
          GITROOT="${RUNNER_TEMP}/git"
          WS_PARENT="$(dirname "${GITHUB_WORKSPACE}")"

          # riir-refine itself is part of the generator's REPOS list.
          ln -sfn "${GITHUB_WORKSPACE}" "${GITROOT}/riir-refine"

          # Make the sibling-beside-workspace layout that riir-refine's own
          # `../<name>` cargo path deps expect.
          for name in katgpt-rs riir-ai riir-train riir-neuron-db riir-chain \
                      riir-game-sdk riir-mmorpg-examples \
                      riir-viewbridge riir-dapps; do
            if [ -d "${GITROOT}/${name}" ]; then
              ln -sfn "${GITROOT}/${name}" "${WS_PARENT}/${name}"
            else
              echo "::warning::sibling ${name} not checked out — its cargo path deps (if referenced) and dashboard sources degrade"
            fi
          done

          # (No /Users/katopz symlink: RIIR_GIT_ROOT landed — see header (a).)
          echo "GITROOT=${GITROOT}"
          ls -la "${GITROOT}"

      - name: Install Rust (1.97.0, per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-refine-nightly

      - name: Build cargo-refine
        run: |
          set -euo pipefail
          cargo build --release --features latent_retrieval,rust_perf --bin cargo-refine
          mkdir -p "${HOME}/.cargo/bin"
          cp target/release/cargo-refine "${HOME}/.cargo/bin/cargo-refine"
          ls -l "${HOME}/.cargo/bin/cargo-refine"

      - name: Regenerate dashboard (--sweep)
        env:
          RIIR_GIT_ROOT: ${{ runner.temp }}/git
          CLOUDFLARE_OPS_API_TOKEN: ${{ secrets.CLOUDFLARE_OPS_API_TOKEN }}
        run: |
          set -euo pipefail
          # CLOUDFLARE_OPS_API_TOKEN is read straight from env by the generator (header
          # note (b)) — no fabricated wrangler config file, so the token never
          # lands on the runner's disk.
          [ -n "${CLOUDFLARE_OPS_API_TOKEN}" ] || \
            echo "::warning::CLOUDFLARE_OPS_API_TOKEN unset — CF analytics sections will be empty"
          python3 scripts/gen_dashboard.py --sweep

      - name: Commit refreshed artifacts
        id: commit
        run: |
          set -euo pipefail
          git config user.name "ops-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Same artifact set as scripts/ops_nightly.sh ARTIFACTS (2026-09-01
          # parity): `.benchmarks/corpus_history.jsonl` is written on BOTH
          # generator code paths, independent of --sweep, and a new calendar
          # day always appends a row — the CI path was missing it, so every
          # CI run silently dropped that day's corpus-series row (the exact
          # T17 defect fixed in the nightly script on 2026-08-29 and never
          # ported here). The ledger rides --settle locally; listed for
          # parity so a future CI --settle cannot regress this class.
          git add .benchmarks/dashboard_coverage.json \
                  .benchmarks/corpus_history.jsonl \
                  .benchmarks/llm_cost_ledger.jsonl \
                  cloudflare/dashboard/public/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "no artifact changes — nothing to commit"
          else
            git commit -m "chore(ops): nightly dashboard refresh [skip ci]"
            # Push is best-effort (nightly parity): a race with a concurrent
            # agent on develop must not skip the deploy of the locally
            # refreshed artifacts — the deploy repairs the divergence next
            # run, a red job for a push race does not.
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              :
            else
              echo "::warning::push failed (develop raced a concurrent writer) — deploying the locally refreshed artifacts anyway"
            fi
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify dashboard DOM (the y="83"-concat gate)
        # Issue 044 T13 — `verify_dom.mjs` is the anti-vacuity gate for the
        # generated page: it stubs the DOM, executes the emitted script, and
        # asserts every chart rect lands on the row lattice (the string-concat
        # class that put 39 rects off-lattice at HEAD once) + corpus ys + the
        # sparkline range labels. Runs BEFORE commit AND deploy (2026-09-01,
        # parity with scripts/ops_nightly.sh step 2): a generator change that
        # breaks the DOM must not reach the Worker — and must not be COMMITTED
        # either; the nightly's rule is "never deploy or commit an HTML that
        # does not render", and this step used to sit after the commit.
        run: node cloudflare/dashboard/verify_dom.mjs cloudflare/dashboard/public/index.html

      - name: Deploy dashboard Worker (soft-skip when unconfigured)
        # Nightly deploys only when artifacts changed; a manual
        # workflow_dispatch always attempts the deploy (repair path).
        if: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "7e11517c4dd4f6e9cede7da9b60d66eb"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN unset — skipping Worker deploy (artifacts are committed)"
            exit 0
          fi
          cd cloudflare/dashboard
          # Pinned on purpose (2026-09-01, parity with scripts/ops_nightly.sh):
          # a bare `npx --yes wrangler` resolves the LATEST wrangler from the
          # npm registry at run time and executes it UNATTENDED with this
          # account's deploy credentials. Bump deliberately after checking
          # the release; never let it float.
          WRANGLER_VERSION="4.127.1"
          # Stamped BEFORE the upload so the check below can ask "did a
          # deployment land AFTER we started?" — the question wrangler's exit
          # code does not answer. T16.2 parity with the nightly's step 4a
          # (2026-09-01): this CI path previously shipped without ANY
          # post-deploy verification — `wrangler deploy` exiting 0 means the
          # API accepted the upload, NOT that the deployment landed. This
          # issue has been bitten three times by a green surface over a wrong
          # fact (044 T12/T15/T16). The deployment list is posture-independent,
          # so this gate survives closing the auth gate (T13).
          _t0="$(date -u +%Y-%m-%dT%H:%M:%S)"
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          # The parser is a ONE-LINER on purpose: a multi-line `python3 -c`
          # argument has zero-indented lines, which TERMINATE a YAML literal
          # block scalar — the workflow would not even parse. An unreadable
          # list still yields "" → the INCONCLUSIVE branch, so the
          # three-outcome contract survives the flattening.
          _newest="$(timeout 120 npx --yes "wrangler@${WRANGLER_VERSION}" deployments list --json 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(max(x["created_on"] for x in d) if d else "")' 2>/dev/null || true)"
          # THREE outcomes, not two (same rationale as the nightly): "could
          # not measure" must never be reported as "measured stale" — a
          # network blip on this read must not turn a correct deploy red.
          case "${_newest}" in
            "")
              echo "::notice::post-deploy verify INCONCLUSIVE — could not read the deployment list; deploy itself reported success" ;;
            *)
              if [ "${_newest}" \> "${_t0}" ]; then
                echo "verified: deployment landed at ${_newest} (after ${_t0})"
              else
                echo "::error::post-deploy verify FAILED — wrangler exited 0 but the newest deployment is ${_newest}, not newer than ${_t0}: production may still serve the PREVIOUS build"
                exit 1
              fi ;;
          esac
