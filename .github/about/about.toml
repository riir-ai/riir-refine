# Proposal 003 T2.3 / Plan 105 — THIRD_PARTY_LICENSES.md generation config.
# Scope = the SHIPPING feature set (default + `latent_retrieval`); the
# `targets` table keeps windows-/dev-only deps out of the shipped document
# while covering exactly the five release triples.
#
# A dependency whose license is not in `accepted` FAILS generation — that is
# the compliance gate (loud, not silently skipped). Extend only after a human
# reads the license.
#
# Owner-mandated read 2026-09-08 (the kat_transport addition, release.yml):
# CDLA-Permissive-2.0 was read and accepted for webpki-roots 0.26/1.0 — it
# covers ONLY the bundled Mozilla root-store DATA (use/modify/share freely,
# keep the agreement text with the data, no other conditions; §3 explicitly
# frees results). Not viral, no notice burden beyond the shipped license
# text. ureq/rustls/qrcode and the rest of the transport tree resolve to
# already-accepted SPDX ids.
# Our own unpublished crates (publish = false: riir-refine itself, riir-kat,
# riir-auth, riir-neuron-db, riir-rag) are NOT third-party and are not open
# source — they ship under the binary's EULA (release/LICENSE.md), so they are
# left out of THIRD_PARTY_LICENSES.md. Public crates (katgpt-*, crates.io) stay.
private = { ignore = true }

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
