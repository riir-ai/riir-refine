<svg xmlns="http://www.w3.org/2000/svg" id="self-evolve-flow" data-gfflow="1" viewBox="0 0 1756 738" width="1756" height="738" role="img" aria-labelledby="self-evolve-flow-t self-evolve-flow-d">
<title id="self-evolve-flow-t">cargo refine: the self-evolve flywheel — the local loop and the opt-in fleet loop</title>
<desc id="self-evolve-flow-d">9 steps in path order. 1. Scan: the span pool over your crate — a dry run writes nothing (your machine; live). 2. Retrieve: corpus rules + your past fixes, top-K (your machine; live). 3. Draft + validate: modelless proposers draft; a real-clippy oracle judges (your machine; live). 4. Fix, compile-gated: kept only if your crate still compiles (your machine; live). 5. Record: every verified outcome becomes a trajectory (your machine; live). 6a. If verified outcomes: Learn: skill memory updates from verified outcomes (the learning loop; live). 6b.1. If opt-in: Contribution batch: opt-in: redacted records queue to leave (riir.ai). 6b.2. If syncs: Proof + payout: verified at real clippy; the epoch settle pays points (riir.ai). 7. If the corpus grows: Leased corpus: the fleet corpus refreshes retrieval on every machine (back to your machine; riir.ai). From 6a back to 2: sharper retrieval next run. From 7 back to 2: every machine retrieves more.</desc>
<style>#self-evolve-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#self-evolve-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#self-evolve-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#self-evolve-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#self-evolve-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#self-evolve-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#self-evolve-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#self-evolve-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#self-evolve-flow .e{fill:none;stroke-width:1.6}#self-evolve-flow .eb{fill:none;stroke-width:2}</style>
