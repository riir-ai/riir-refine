<rect width="1756" height="738" rx="14" fill="#11141b"/>
<g data-lane="local"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#3fd68a">YOUR MACHINE</tspan><tspan class="ln" dx="12">every cargo refine run · free · private</tspan></text></g>
<g data-lane="loop"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#3fd68a">THE LEARNING LOOP</tspan><tspan class="ln" dx="12">your outcomes, your machine</tspan></text></g>
<g data-lane="fleet"><rect x="10" y="368" width="1736" height="180" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#5cc8e8">THE NETWORK</tspan><tspan class="ln" dx="12">opt-in · the network side</tspan></text></g>
<g data-lane="lease"><rect x="10" y="560" width="1736" height="166" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="585"><tspan class="lh" fill="#3fd68a">BACK TO YOUR MACHINE</tspan><tspan class="ln" dx="12">the wheel closes</tspan></text></g>
