<g data-edge="lse->ret"><path class="eb" d="M400.7,602 400.7,162" stroke="#3fd68a" marker-end="url(#self-evolve-flow-a1)"/><text class="el" x="410.7" y="386" text-anchor="start" style="fill:#3fd68a">every machine retrieves more</text></g>
