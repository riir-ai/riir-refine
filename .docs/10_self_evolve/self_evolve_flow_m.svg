<rect width="340" height="1422" rx="14" fill="#11141b"/>
<g data-step="scan" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="104" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="80" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Scan</text><text x="22" y="80" class="d">the span pool over your crate — a dry run</text><text x="22" y="98" class="d">writes nothing</text></g>
