<g data-edge="rec->mine"><path class="e" d="M44,824 V852" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="842">↳ from 5 · opt-in</text></g>
<g data-step="mine" data-n="6b.1"><rect class="gf-cb" x="4" y="858" width="332" height="116" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="870" width="4" height="92" rx="2" fill="#5cc8e8"/><text x="22" y="880" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="876" r="3.5" fill="#60a5fa"/><text x="318" y="880" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><rect x="22" y="890" width="42.1" height="22" rx="11" fill="#5cc8e8"/><text x="43" y="905.5" text-anchor="middle" class="n">6b.1</text><text x="74.1" y="906" class="t">Contribution batch</text><text x="22" y="930" class="d">opt-in: redacted records queue to leave</text><rect x="22" y="940" width="186.4" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="954" class="s" fill="#3fd68a">opt-in · off by default</text></g>
