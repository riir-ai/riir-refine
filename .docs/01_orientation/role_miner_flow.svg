<g data-step="join" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#3fd68a"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Join once</text><text x="46" y="109" class="d">cargo refine join:</text><text x="46" y="128" class="d">consent · login · sync</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text><rect x="58.3" y="168" width="173.4" height="22" rx="11" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="145" y="183.5" text-anchor="middle" class="s" fill="#3fd68a">opt-in · reversible</text></g>
<g data-step="bat" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#3fd68a"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">The redacted batch</text><text x="340" y="109" class="d">verdicts + touched snippets,</text><text x="340" y="128" class="d">secret-scanned, signed</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="proof" data-n="3"><rect class="gf-cb" x="618" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="640" cy="270" r="12" fill="#5cc8e8"/><text x="640" y="274.5" text-anchor="middle" class="n">3</text><text x="662" y="275" class="t">Proof queue</text><text x="634" y="301" class="d">rows are verified at a real</text><text x="634" y="320" class="d">clippy re-run</text><circle cx="638" cy="338" r="4" fill="#60a5fa"/><text x="648" y="342" class="s" fill="#60a5fa">riir.ai</text></g>
<g data-step="pay" data-n="4a"><rect class="gf-cb" x="912" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="922" y="258" width="29.6" height="24" rx="12" fill="#5cc8e8"/><text x="936.8" y="274.5" text-anchor="middle" class="n">4a</text><text x="961.6" y="275" class="t">Points at the settle</text><text x="928" y="301" class="d">the pool pays — contributing =</text><text x="928" y="320" class="d">processing, proven = paid</text><circle cx="932" cy="338" r="4" fill="#60a5fa"/><text x="942" y="342" class="s" fill="#60a5fa">riir.ai</text><rect x="962.4" y="360" width="129.2" height="22" rx="11" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="1027" y="375.5" text-anchor="middle" class="s" fill="#5cc8e8">never re-gated</text></g>
<g data-step="grow" data-n="4b"><rect class="gf-cb" x="1206" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="1216" y="258" width="30.4" height="24" rx="12" fill="#5cc8e8"/><text x="1231.2" y="274.5" text-anchor="middle" class="n">4b</text><text x="1256.4" y="275" class="t">The corpus grows</text><text x="1222" y="301" class="d">the network&#x27;s observed</text><text x="1222" y="320" class="d">pattern classes</text><circle cx="1226" cy="338" r="4" fill="#60a5fa"/><text x="1236" y="342" class="s" fill="#60a5fa">riir.ai</text></g>
</svg>
