<svg xmlns="http://www.w3.org/2000/svg" id="role-miner-flow" data-gfflow="1" viewBox="0 0 1462 396" width="1462" height="396" role="img" aria-labelledby="role-miner-flow-t role-miner-flow-d">
<title id="role-miner-flow-t">The contributor loop: redacted records up, proof at real clippy, points at the epoch settle — and the corpus leases back</title>
<desc id="role-miner-flow-d">5 steps in path order. 1. Join once: cargo refine join — consent · login · first sync (your machine; live). 2. The redacted batch: verdicts + touched snippets, secret-scanned, signed (your machine; live). 3. If sync: Proof queue: rows are verified at a real clippy re-run (riir.ai). 4a. If pays: Points at the settle: the pool pays — contributing = processing, proven = paid (riir.ai). 4b. If grows: The corpus grows: the network&#x27;s observed pattern classes (riir.ai). From 4b back to 2: leased back — your own retrieval improves.</desc>
<style>#role-miner-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#role-miner-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#role-miner-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-miner-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-miner-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-miner-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-miner-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-miner-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#role-miner-flow .e{fill:none;stroke-width:1.6}#role-miner-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="role-miner-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="role-miner-flow-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fd68a"/></marker></defs>
<rect width="1462" height="396" rx="14" fill="#11141b"/>
<g data-lane="me"><rect x="10" y="12" width="1442" height="180" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#3fd68a">YOUR MACHINE</tspan><tspan class="ln" dx="12">the pro tier · opt-in</tspan></text></g>
<g data-lane="fleet"><rect x="10" y="204" width="1442" height="180" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="229"><tspan class="lh" fill="#5cc8e8">THE NETWORK</tspan><tspan class="ln" dx="12">the network side</tspan></text></g>
<g data-edge="join->bat"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#role-miner-flow-a0)"/></g>
<g data-edge="bat->proof"><path class="e" d="M554,90 733,90 733,246" stroke="#69718a" marker-end="url(#role-miner-flow-a0)"/><text class="el" x="643.5" y="81" text-anchor="middle">consent · login · sync</text></g>
<g data-edge="proof->pay"><path class="e" d="M848,282 912,282" stroke="#69718a" marker-end="url(#role-miner-flow-a0)"/><text class="el" x="880" y="273" text-anchor="middle">pays</text></g>
<g data-edge="proof->grow"><path class="e" d="M848,318 1206,318" stroke="#69718a" marker-end="url(#role-miner-flow-a0)"/><text class="el" x="866" y="309" text-anchor="start">grows</text></g>
