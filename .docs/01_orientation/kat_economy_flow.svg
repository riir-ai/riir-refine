<svg xmlns="http://www.w3.org/2000/svg" id="kat-economy-flow" data-gfflow="1" viewBox="0 0 1756 546" width="1756" height="546" role="img" aria-labelledby="kat-economy-flow-t kat-economy-flow-d">
<title id="kat-economy-flow-t">The KAT economy: the meter runs locally, burns fund the pool, the settle pays the fleet — and the corpus leases back</title>
<desc id="kat-economy-flow-d">6 steps in path order. 1. The run is metered: counts code-word tokens; logged out = never billed (your machine; live). 2a. If trial credit left: TUNA pays first: where funded: one grant · 30 days, expires (the ledger; test network). 2b. If after TUNA · logged in: KAT pays: after the trial — metered totals, signed (the ledger; test network). 3. If burns: The mining pool: every KAT burn funds the next epoch&#x27;s rewards (the ledger; test network). 4. If the epoch closes: The settle pays: rows mint — mining = processing, minted = paid (miners; test network). 5. If the corpus grows: The lease-back: the fleet corpus refreshes every machine (your machine; test network). From 5 back to 1: every machine refines better.</desc>
<style>#kat-economy-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#kat-economy-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#kat-economy-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#kat-economy-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#kat-economy-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#kat-economy-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#kat-economy-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#kat-economy-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#kat-economy-flow .e{fill:none;stroke-width:1.6}#kat-economy-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="kat-economy-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="kat-economy-flow-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fd68a"/></marker></defs>
<rect width="1756" height="546" rx="14" fill="#11141b"/>
<g data-lane="me"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#3fd68a">YOUR MACHINE</tspan><tspan class="ln" dx="12">the meter runs locally</tspan></text></g>
<g data-lane="led"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#5cc8e8">THE LEDGER</tspan><tspan class="ln" dx="12">every burn, public</tspan></text></g>
<g data-lane="flt"><rect x="10" y="368" width="1736" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#5cc8e8">MINERS</tspan><tspan class="ln" dx="12">the fleet that earns</tspan></text></g>
<g data-edge="meter->tuna"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#kat-economy-flow-a0)"/><text class="el" x="349.5" y="99" text-anchor="middle">trial credit left</text></g>
<g data-edge="meter->kat"><path class="e" d="M260,135 733,135 733,232" stroke="#69718a" marker-end="url(#kat-economy-flow-a0)"/><text class="el" x="715" y="126" text-anchor="end">after TUNA · logged in</text></g>
<g data-edge="kat->pool"><path class="e" d="M848,286 912,286" stroke="#69718a" marker-end="url(#kat-economy-flow-a0)"/><text class="el" x="880" y="277" text-anchor="middle">burns</text></g>
<g data-edge="pool->settle"><path class="e" d="M1142,286 1321,286 1321,410" stroke="#69718a" marker-end="url(#kat-economy-flow-a0)"/><text class="el" x="1231.5" y="277" text-anchor="middle">the epoch closes</text></g>
<g data-edge="settle->lease"><path class="e" d="M1436,464 1615,464 1615,162" stroke="#69718a" marker-end="url(#kat-economy-flow-a0)"/><text class="el" x="1605" y="317" text-anchor="end">the corpus grows</text></g>
<g data-edge="lease->meter"><path class="eb" d="M1500,81 260,81" stroke="#3fd68a" marker-end="url(#kat-economy-flow-a1)"/><text class="el" x="880" y="72" text-anchor="middle" style="fill:#3fd68a">every machine refines better</text></g>
<g data-step="meter" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#3fd68a"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">The run is metered</text><text x="46" y="109" class="d">counts code-word tokens;</text><text x="46" y="128" class="d">logged out = never billed</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="tuna" data-n="2a"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="334" y="244" width="29.6" height="24" rx="12" fill="#5cc8e8"/><text x="348.8" y="260.5" text-anchor="middle" class="n">2a</text><text x="373.6" y="261" class="t">TUNA pays first</text><text x="340" y="287" class="d">where funded: one grant · 30</text><text x="340" y="306" class="d">days, expires</text><circle cx="344" cy="324" r="4" fill="#60a5fa"/><text x="354" y="328" class="s" fill="#60a5fa">test network</text></g>
<g data-step="kat" data-n="2b"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="628" y="244" width="30.4" height="24" rx="12" fill="#5cc8e8"/><text x="643.2" y="260.5" text-anchor="middle" class="n">2b</text><text x="668.4" y="261" class="t">KAT pays</text><text x="634" y="287" class="d">after the trial — metered</text><text x="634" y="306" class="d">totals, signed</text><circle cx="638" cy="324" r="4" fill="#60a5fa"/><text x="648" y="328" class="s" fill="#60a5fa">test network</text></g>
<g data-step="pool" data-n="3"><rect class="gf-cb" x="912" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="934" cy="256" r="12" fill="#5cc8e8"/><text x="934" y="260.5" text-anchor="middle" class="n">3</text><text x="956" y="261" class="t">The mining pool</text><text x="928" y="287" class="d">every KAT burn funds the next</text><text x="928" y="306" class="d">epoch&#x27;s rewards</text><circle cx="932" cy="324" r="4" fill="#60a5fa"/><text x="942" y="328" class="s" fill="#60a5fa">test network</text></g>
<g data-step="settle" data-n="4"><rect class="gf-cb" x="1206" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="1228" cy="434" r="12" fill="#5cc8e8"/><text x="1228" y="438.5" text-anchor="middle" class="n">4</text><text x="1250" y="439" class="t">The settle pays</text><text x="1222" y="465" class="d">rows mint — mining =</text><text x="1222" y="484" class="d">processing, minted = paid</text><circle cx="1226" cy="502" r="4" fill="#60a5fa"/><text x="1236" y="506" class="s" fill="#60a5fa">test network</text></g>
<g data-step="lease" data-n="5"><rect class="gf-cb" x="1500" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="1522" cy="78" r="12" fill="#3fd68a"/><text x="1522" y="82.5" text-anchor="middle" class="n">5</text><text x="1544" y="83" class="t">The lease-back</text><text x="1516" y="109" class="d">the fleet corpus refreshes</text><text x="1516" y="128" class="d">every machine</text><circle cx="1520" cy="146" r="4" fill="#60a5fa"/><text x="1530" y="150" class="s" fill="#60a5fa">test network</text></g>
</svg>
