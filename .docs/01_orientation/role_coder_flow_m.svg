<svg xmlns="http://www.w3.org/2000/svg" id="role-coder-flow-m" data-gfflow="1" viewBox="0 0 340 510" width="340" height="510" role="img" aria-labelledby="role-coder-flow-m-t role-coder-flow-m-d">
<title id="role-coder-flow-m-t">The coder loop: dry-run first, then the compile-gated fix — free, anonymous, entirely on your machine</title>
<desc id="role-coder-flow-m-d">4 steps in path order. 1. Install: one prebuilt binary lands in ~/.cargo/bin (your machine; live). 2. Dry run: lists the fixes it would make, writes nothing (your machine; live). 3. The compile gate: kept only if your crate still compiles (your machine; live). 4. Fixed code: clippy · perf · docker · dist + compile errors (your machine; live).</desc>
<style>#role-coder-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#role-coder-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-coder-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-coder-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-coder-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-coder-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#role-coder-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="role-coder-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="510" rx="14" fill="#11141b"/>
<g data-step="inst" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE · EVERY RUN</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Install</text><text x="22" y="80" class="d">one prebuilt binary lands in ~/.cargo/bin</text></g>
<g data-edge="inst->dry"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="dry" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="156" class="k" fill="#3fd68a">YOUR MACHINE · EVERY RUN</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#3fd68a"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Dry run</text><text x="22" y="206" class="d">lists the fixes it would make, writes nothing</text><rect x="22" y="216" width="143.2" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="230" class="s" fill="#3fd68a">free · no account</text></g>
<g data-edge="dry->fix"><path class="e" d="M44,250 V290" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="fix" data-n="3"><rect class="gf-cb" x="4" y="290" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="302" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="312" class="k" fill="#3fd68a">YOUR MACHINE · EVERY RUN</text><circle cx="280.2" cy="308" r="3.5" fill="#4ade80"/><text x="318" y="312" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="333" r="11" fill="#3fd68a"/><text x="33" y="337.5" text-anchor="middle" class="n">3</text><text x="54" y="338" class="t">The compile gate</text><text x="22" y="362" class="d">kept only if your crate still compiles</text></g>
<g data-edge="fix->get"><path class="e" d="M44,376 V416" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="get" data-n="4"><rect class="gf-cb" x="4" y="416" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="428" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="438" class="k" fill="#3fd68a">YOUR MACHINE · EVERY RUN</text><circle cx="280.2" cy="434" r="3.5" fill="#4ade80"/><text x="318" y="438" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="459" r="11" fill="#3fd68a"/><text x="33" y="463.5" text-anchor="middle" class="n">4</text><text x="54" y="464" class="t">Fixed code</text><text x="22" y="488" class="d">clippy · perf · docker · dist + compile errors</text></g>
</svg>
