<svg xmlns="http://www.w3.org/2000/svg" id="role-coder-flow-m" data-gfflow="1" viewBox="0 0 340 686" width="340" height="686" role="img" aria-labelledby="role-coder-flow-m-t role-coder-flow-m-d">
<title id="role-coder-flow-m-t">The coder loop: dry-run first, then the compile-gated fix — the meter draws TUNA before KAT</title>
<desc id="role-coder-flow-m-d">5 steps in path order. 1. Install: one prebuilt binary lands in ~/.cargo/bin (your machine; live). 2. Dry run: lists the fixes it would make, writes nothing (your machine; live). 3. The compile gate: kept only if your crate still compiles (your machine; live). 4a. Fixed code: clippy · perf · docker · dist + compile errors (your machine; live). 4b. If logged in: The burn meter: 1 KAT-equiv / 1M code-word tokens; TUNA pays first (the billing plane; live).</desc>
<style>#role-coder-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#role-coder-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-coder-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-coder-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-coder-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-coder-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#role-coder-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="role-coder-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="686" rx="14" fill="#11141b"/>
<g data-step="inst" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Install</text><text x="22" y="80" class="d">one prebuilt binary lands in ~/.cargo/bin</text></g>
<g data-edge="inst->dry"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="dry" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="156" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#3fd68a"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Dry run</text><text x="22" y="206" class="d">lists the fixes it would make, writes nothing</text><rect x="22" y="216" width="196" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="230" class="s" fill="#3fd68a">logged out = never billed</text></g>
<g data-edge="dry->fix"><path class="e" d="M44,250 V290" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="fix" data-n="3"><rect class="gf-cb" x="4" y="290" width="332" height="118" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="302" width="4" height="94" rx="2" fill="#3fd68a"/><text x="22" y="312" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="308" r="3.5" fill="#4ade80"/><text x="318" y="312" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="333" r="11" fill="#3fd68a"/><text x="33" y="337.5" text-anchor="middle" class="n">3</text><text x="54" y="338" class="t">The compile gate</text><text x="22" y="362" class="d">kept only if your crate still compiles</text><rect x="22" y="374" width="49.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="388" class="el">→ 4a</text><rect x="77.6" y="374" width="140.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="85.6" y="388" class="el">→ 4b · logged in</text></g>
<g data-edge="fix->get"><path class="e" d="M44,408 V448" stroke="#69718a" marker-end="url(#role-coder-flow-m-a0)"/>
</g>
<g data-step="get" data-n="4a"><rect class="gf-cb" x="4" y="448" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="460" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="470" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="466" r="3.5" fill="#4ade80"/><text x="318" y="470" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="480" width="29.6" height="22" rx="11" fill="#3fd68a"/><text x="36.8" y="495.5" text-anchor="middle" class="n">4a</text><text x="61.6" y="496" class="t">Fixed code</text><text x="22" y="520" class="d">clippy · perf · docker · dist + compile errors</text></g>
<g data-edge="fix->meter"><path class="e" d="M44,540 V568" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="558">↳ from 3 · logged in</text></g>
<g data-step="meter" data-n="4b"><rect class="gf-cb" x="4" y="574" width="332" height="104" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="586" width="4" height="80" rx="2" fill="#5cc8e8"/><text x="22" y="596" class="k" fill="#5cc8e8">THE BILLING PLANE</text><circle cx="280.2" cy="592" r="3.5" fill="#4ade80"/><text x="318" y="596" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="606" width="30.4" height="22" rx="11" fill="#5cc8e8"/><text x="37.2" y="621.5" text-anchor="middle" class="n">4b</text><text x="62.4" y="622" class="t">The burn meter</text><text x="22" y="646" class="d">1 KAT-equiv / 1M code-word tokens; TUNA</text><text x="22" y="664" class="d">pays first</text></g>
</svg>
