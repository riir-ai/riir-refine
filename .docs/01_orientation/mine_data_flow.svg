<svg xmlns="http://www.w3.org/2000/svg" id="mine-data-flow" data-gfflow="1" viewBox="0 0 2050 574" width="2050" height="574" role="img" aria-labelledby="mine-data-flow-t mine-data-flow-d">
<title id="mine-data-flow-t">What mining sends: your fix spans leave signed, the network proves them, and proven pairs join the public corpus</title>
<desc id="mine-data-flow-d">8 steps in path order. 1. Your fix run: compile-gated, local; records each fix (your machine; live). 2. One row per fix: the span it replaced + the fix; no paths (your machine; live). 3. Secret scan + sign: a finding drops the row; Ed25519 signed (your machine; live). 4a. If export: Export only: sync --export writes a file, sends nothing (your machine; live). 4b. If send: Sent over HTTPS: the signed batch; the server checks the key (the network; test network). 5. If queued: Proof queue: a real clippy re-run confirms the fix (the network; test network). 6. If proven: Public corpus: proven before/after pairs, downloadable (everyone; test network). 7. If pull: Lease back: every machine downloads the corpus (your machine; test network). From 7 back to 1: your next run retrieves more.</desc>
<style>#mine-data-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#mine-data-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#mine-data-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#mine-data-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#mine-data-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#mine-data-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#mine-data-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#mine-data-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#mine-data-flow .e{fill:none;stroke-width:1.6}#mine-data-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="mine-data-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="mine-data-flow-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fd68a"/></marker></defs>
<rect width="2050" height="574" rx="14" fill="#11141b"/>
<g data-lane="me"><rect x="10" y="12" width="2030" height="180" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#3fd68a">YOUR MACHINE</tspan><tspan class="ln" dx="12">nothing leaves before step 4b</tspan></text></g>
<g data-lane="net"><rect x="10" y="204" width="2030" height="180" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="229"><tspan class="lh" fill="#5cc8e8">THE NETWORK</tspan><tspan class="ln" dx="12">the operator reads it</tspan></text></g>
<g data-lane="pub"><rect x="10" y="396" width="2030" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="421"><tspan class="lh" fill="#5cc8e8">EVERYONE</tspan><tspan class="ln" dx="12">public, no login</tspan></text></g>
<g data-edge="run->rows"><path class="e" d="M260,90 324,90" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/></g>
<g data-edge="rows->scan"><path class="e" d="M554,108 618,108" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/></g>
<g data-edge="scan->export"><path class="e" d="M848,108 912,108" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/><text class="el" x="880" y="99" text-anchor="middle">export</text></g>
<g data-edge="scan->post"><path class="e" d="M733,162 733,300 912,300" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/><text class="el" x="822.5" y="291" text-anchor="middle">send</text></g>
<g data-edge="post->proof"><path class="e" d="M1142,300 1206,300" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/><text class="el" x="1174" y="291" text-anchor="middle">queued</text></g>
<g data-edge="proof->pub"><path class="e" d="M1436,300 1615,300 1615,438" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/><text class="el" x="1525.5" y="291" text-anchor="middle">proven</text></g>
<g data-edge="pub->lease"><path class="e" d="M1730,492 1909,492 1909,162" stroke="#69718a" marker-end="url(#mine-data-flow-a0)"/><text class="el" x="1919" y="331" text-anchor="start">pull</text></g>
<g data-edge="lease->run"><path class="eb" d="M1794,126 260,126" stroke="#3fd68a" marker-end="url(#mine-data-flow-a1)"/><text class="el" x="1776" y="117" text-anchor="end" style="fill:#3fd68a">your next run retrieves more</text></g>
<g data-step="run" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#3fd68a"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Your fix run</text><text x="46" y="109" class="d">compile-gated, local; records</text><text x="46" y="128" class="d">each fix</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="rows" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#3fd68a"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">One row per fix</text><text x="340" y="109" class="d">the span it replaced + the fix;</text><text x="340" y="128" class="d">no paths</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text><rect x="362.7" y="168" width="152.6" height="22" rx="11" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="439" y="183.5" text-anchor="middle" class="s" fill="#3fd68a">never whole files</text></g>
<g data-step="scan" data-n="3"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="640" cy="78" r="12" fill="#3fd68a"/><text x="640" y="82.5" text-anchor="middle" class="n">3</text><text x="662" y="83" class="t">Secret scan + sign</text><text x="634" y="109" class="d">a finding drops the row;</text><text x="634" y="128" class="d">Ed25519 signed</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="export" data-n="4a"><rect class="gf-cb" x="912" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="922" y="66" width="29.6" height="24" rx="12" fill="#3fd68a"/><text x="936.8" y="82.5" text-anchor="middle" class="n">4a</text><text x="961.6" y="83" class="t">Export only</text><text x="928" y="109" class="d">sync --export writes a file,</text><text x="928" y="128" class="d">sends nothing</text><circle cx="932" cy="146" r="4" fill="#4ade80"/><text x="942" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="post" data-n="4b"><rect class="gf-cb" x="912" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="922" y="258" width="30.4" height="24" rx="12" fill="#5cc8e8"/><text x="937.2" y="274.5" text-anchor="middle" class="n">4b</text><text x="962.4" y="275" class="t">Sent over HTTPS</text><text x="928" y="301" class="d">the signed batch; the server</text><text x="928" y="320" class="d">checks the key</text><circle cx="932" cy="338" r="4" fill="#60a5fa"/><text x="942" y="342" class="s" fill="#60a5fa">test network</text><rect x="935.1" y="360" width="183.8" height="22" rx="11" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="1027" y="375.5" text-anchor="middle" class="s" fill="#5cc8e8">signed, not encrypted</text></g>
<g data-step="proof" data-n="5"><rect class="gf-cb" x="1206" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="1228" cy="270" r="12" fill="#5cc8e8"/><text x="1228" y="274.5" text-anchor="middle" class="n">5</text><text x="1250" y="275" class="t">Proof queue</text><text x="1222" y="301" class="d">a real clippy re-run confirms</text><text x="1222" y="320" class="d">the fix</text><circle cx="1226" cy="338" r="4" fill="#60a5fa"/><text x="1236" y="342" class="s" fill="#60a5fa">test network</text></g>
<g data-step="pub" data-n="6"><rect class="gf-cb" x="1500" y="438" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="1522" cy="462" r="12" fill="#5cc8e8"/><text x="1522" y="466.5" text-anchor="middle" class="n">6</text><text x="1544" y="467" class="t">Public corpus</text><text x="1516" y="493" class="d">proven before/after pairs,</text><text x="1516" y="512" class="d">downloadable</text><circle cx="1520" cy="530" r="4" fill="#60a5fa"/><text x="1530" y="534" class="s" fill="#60a5fa">test network</text></g>
<g data-step="lease" data-n="7"><rect class="gf-cb" x="1794" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="1816" cy="78" r="12" fill="#3fd68a"/><text x="1816" y="82.5" text-anchor="middle" class="n">7</text><text x="1838" y="83" class="t">Lease back</text><text x="1810" y="109" class="d">every machine downloads the</text><text x="1810" y="128" class="d">corpus</text><circle cx="1814" cy="146" r="4" fill="#60a5fa"/><text x="1824" y="150" class="s" fill="#60a5fa">test network</text></g>
</svg>
