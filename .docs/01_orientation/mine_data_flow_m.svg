<svg xmlns="http://www.w3.org/2000/svg" id="mine-data-flow-m" data-gfflow="1" viewBox="0 0 340 1152" width="340" height="1152" role="img" aria-labelledby="mine-data-flow-m-t mine-data-flow-m-d">
<title id="mine-data-flow-m-t">What mining sends: your fix spans leave signed, the network proves them, and proven pairs join the public corpus</title>
<desc id="mine-data-flow-m-d">8 steps in path order. 1. Your fix run: compile-gated, local; records each fix (your machine; live). 2. One row per fix: the span it replaced + the fix; no paths (your machine; live). 3. Secret scan + sign: a finding drops the row; Ed25519 signed (your machine; live). 4a. If export: Export only: sync --export writes a file, sends nothing (your machine; live). 4b. If send: Sent over HTTPS: the signed batch; the server checks the key (the network; test network). 5. If queued: Proof queue: a real clippy re-run confirms the fix (the network; test network). 6. If proven: Public corpus: proven before/after pairs, downloadable (everyone; test network). 7. If pull: Lease back: every machine downloads the corpus (your machine; test network). From 7 back to 1: your next run retrieves more.</desc>
<style>#mine-data-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#mine-data-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#mine-data-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#mine-data-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#mine-data-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#mine-data-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#mine-data-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="mine-data-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1152" rx="14" fill="#11141b"/>
<g data-step="run" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Your fix run</text><text x="22" y="80" class="d">compile-gated, local; records each fix</text></g>
<g data-edge="run->rows"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
</g>
<g data-step="rows" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="156" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#3fd68a"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">One row per fix</text><text x="22" y="206" class="d">the span it replaced + the fix; no paths</text><rect x="22" y="216" width="138.4" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="230" class="s" fill="#3fd68a">never whole files</text></g>
<g data-edge="rows->scan"><path class="e" d="M44,250 V290" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
</g>
<g data-step="scan" data-n="3"><rect class="gf-cb" x="4" y="290" width="332" height="118" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="302" width="4" height="94" rx="2" fill="#3fd68a"/><text x="22" y="312" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="308" r="3.5" fill="#4ade80"/><text x="318" y="312" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="333" r="11" fill="#3fd68a"/><text x="33" y="337.5" text-anchor="middle" class="n">3</text><text x="54" y="338" class="t">Secret scan + sign</text><text x="22" y="362" class="d">a finding drops the row; Ed25519 signed</text><rect x="22" y="374" width="119.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="388" class="el">→ 4a · export</text><rect x="147.2" y="374" width="104.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="155.2" y="388" class="el">→ 4b · send</text></g>
<g data-edge="scan->export"><path class="e" d="M44,408 V448" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="432">export</text>
</g>
<g data-step="export" data-n="4a"><rect class="gf-cb" x="4" y="448" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="460" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="470" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="466" r="3.5" fill="#4ade80"/><text x="318" y="470" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="480" width="29.6" height="22" rx="11" fill="#3fd68a"/><text x="36.8" y="495.5" text-anchor="middle" class="n">4a</text><text x="61.6" y="496" class="t">Export only</text><text x="22" y="520" class="d">sync --export writes a file, sends nothing</text></g>
<g data-edge="scan->post"><path class="e" d="M44,540 V568" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="558">↳ from 3 · send</text></g>
<g data-step="post" data-n="4b"><rect class="gf-cb" x="4" y="574" width="332" height="116" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="586" width="4" height="92" rx="2" fill="#5cc8e8"/><text x="22" y="596" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="592" r="3.5" fill="#60a5fa"/><text x="318" y="596" text-anchor="end" class="s" fill="#60a5fa">test network</text><rect x="22" y="606" width="30.4" height="22" rx="11" fill="#5cc8e8"/><text x="37.2" y="621.5" text-anchor="middle" class="n">4b</text><text x="62.4" y="622" class="t">Sent over HTTPS</text><text x="22" y="646" class="d">the signed batch; the server checks the key</text><rect x="22" y="656" width="167.2" height="20" rx="10" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="30" y="670" class="s" fill="#5cc8e8">signed, not encrypted</text></g>
<g data-edge="post->proof"><path class="e" d="M44,690 V730" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="714">queued</text>
</g>
<g data-step="proof" data-n="5"><rect class="gf-cb" x="4" y="730" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="742" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="752" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="748" r="3.5" fill="#60a5fa"/><text x="318" y="752" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="773" r="11" fill="#5cc8e8"/><text x="33" y="777.5" text-anchor="middle" class="n">5</text><text x="54" y="778" class="t">Proof queue</text><text x="22" y="802" class="d">a real clippy re-run confirms the fix</text></g>
<g data-edge="proof->pub"><path class="e" d="M44,816 V856" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="840">proven</text>
</g>
<g data-step="pub" data-n="6"><rect class="gf-cb" x="4" y="856" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="868" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="878" class="k" fill="#5cc8e8">EVERYONE</text><circle cx="222.6" cy="874" r="3.5" fill="#60a5fa"/><text x="318" y="878" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="899" r="11" fill="#5cc8e8"/><text x="33" y="903.5" text-anchor="middle" class="n">6</text><text x="54" y="904" class="t">Public corpus</text><text x="22" y="928" class="d">proven before/after pairs, downloadable</text></g>
<g data-edge="pub->lease"><path class="e" d="M44,942 V982" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="966">pull</text>
</g>
<g data-step="lease" data-n="7"><rect class="gf-cb" x="4" y="982" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="994" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="1004" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="222.6" cy="1000" r="3.5" fill="#60a5fa"/><text x="318" y="1004" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="1025" r="11" fill="#3fd68a"/><text x="33" y="1029.5" text-anchor="middle" class="n">7</text><text x="54" y="1030" class="t">Lease back</text><text x="22" y="1054" class="d">every machine downloads the corpus</text></g>
<g data-edge="lease->run"><rect x="4" y="1086" width="332" height="58" rx="12" fill="#3fd68a" fill-opacity=".08" stroke="#3fd68a" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1112" class="el" style="fill:#3fd68a">↺ from 7 back to step 1 · your next run</text><text x="22" y="1130" class="el" style="fill:#3fd68a">retrieves more</text></g>
</svg>
