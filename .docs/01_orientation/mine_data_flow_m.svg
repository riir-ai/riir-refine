<svg xmlns="http://www.w3.org/2000/svg" id="mine-data-flow-m" data-gfflow="1" viewBox="0 0 340 1104" width="340" height="1104" role="img" aria-labelledby="mine-data-flow-m-t mine-data-flow-m-d">
<title id="mine-data-flow-m-t">What contributing sends: your fix spans leave signed, the network proves them, and proven pairs join the public corpus</title>
<desc id="mine-data-flow-m-d">8 steps in path order. 1. Your fix run: compile-gated, local; records each fix (your machine; live). 2. One row per fix: the span it replaced + the fix; no paths (your machine; live). 3. Secret scan + sign: a finding drops the row; Ed25519 signed (your machine; live). 4a. If export: Export only: sync --export writes a file, sends nothing (your machine; live). 4b. If send: Sent over HTTPS: the signed batch; the server checks the key (the network; live on riir.ai). 5. If queued: Proof queue: a real clippy re-run confirms the fix (the network; live on riir.ai). 6. If proven: Public corpus: proven before/after pairs, downloadable (everyone; live on riir.ai). 7. If pull: Lease back: downloads the corpus for your next run (your machine; live on riir.ai). From 7 back to 1.</desc>
<style>#mine-data-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#mine-data-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#mine-data-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#mine-data-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#mine-data-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#mine-data-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#mine-data-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="mine-data-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1104" rx="14" fill="#11141b"/>
<g data-step="run" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Your fix run</text><text x="22" y="80" class="d">compile-gated, local; records each fix</text></g>
<g data-edge="run->rows"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
</g>
<g data-step="rows" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="156" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#3fd68a"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">One row per fix</text><text x="22" y="206" class="d">the span it replaced + the fix; no paths</text></g>
<g data-edge="rows->scan"><path class="e" d="M44,220 V260" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
</g>
<g data-step="scan" data-n="3"><rect class="gf-cb" x="4" y="260" width="332" height="118" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="272" width="4" height="94" rx="2" fill="#3fd68a"/><text x="22" y="282" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="278" r="3.5" fill="#4ade80"/><text x="318" y="282" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="303" r="11" fill="#3fd68a"/><text x="33" y="307.5" text-anchor="middle" class="n">3</text><text x="54" y="308" class="t">Secret scan + sign</text><text x="22" y="332" class="d">a finding drops the row; Ed25519 signed</text><rect x="22" y="344" width="119.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="358" class="el">→ 4a · export</text><rect x="147.2" y="344" width="104.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="155.2" y="358" class="el">→ 4b · send</text></g>
<g data-edge="scan->export"><path class="e" d="M44,378 V418" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="402">export</text>
</g>
<g data-step="export" data-n="4a"><rect class="gf-cb" x="4" y="418" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="430" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="440" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="436" r="3.5" fill="#4ade80"/><text x="318" y="440" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="450" width="29.6" height="22" rx="11" fill="#3fd68a"/><text x="36.8" y="465.5" text-anchor="middle" class="n">4a</text><text x="61.6" y="466" class="t">Export only</text><text x="22" y="490" class="d">sync --export writes a file, sends nothing</text></g>
<g data-edge="scan->post"><path class="e" d="M44,510 V538" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="528">↳ from 3 · send</text></g>
<g data-step="post" data-n="4b"><rect class="gf-cb" x="4" y="544" width="332" height="116" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="556" width="4" height="92" rx="2" fill="#5cc8e8"/><text x="22" y="566" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="562" r="3.5" fill="#60a5fa"/><text x="318" y="566" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><rect x="22" y="576" width="30.4" height="22" rx="11" fill="#5cc8e8"/><text x="37.2" y="591.5" text-anchor="middle" class="n">4b</text><text x="62.4" y="592" class="t">Sent over HTTPS</text><text x="22" y="616" class="d">the signed batch; the server checks the key</text><rect x="22" y="626" width="167.2" height="20" rx="10" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="30" y="640" class="s" fill="#5cc8e8">signed, not encrypted</text></g>
<g data-edge="post->proof"><path class="e" d="M44,660 V700" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="684">queued</text>
</g>
<g data-step="proof" data-n="5"><rect class="gf-cb" x="4" y="700" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="712" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="722" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="718" r="3.5" fill="#60a5fa"/><text x="318" y="722" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><circle cx="33" cy="743" r="11" fill="#5cc8e8"/><text x="33" y="747.5" text-anchor="middle" class="n">5</text><text x="54" y="748" class="t">Proof queue</text><text x="22" y="772" class="d">a real clippy re-run confirms the fix</text></g>
<g data-edge="proof->pub"><path class="e" d="M44,786 V826" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="810">proven</text>
</g>
<g data-step="pub" data-n="6"><rect class="gf-cb" x="4" y="826" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="838" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="848" class="k" fill="#5cc8e8">EVERYONE</text><circle cx="222.6" cy="844" r="3.5" fill="#60a5fa"/><text x="318" y="848" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><circle cx="33" cy="869" r="11" fill="#5cc8e8"/><text x="33" y="873.5" text-anchor="middle" class="n">6</text><text x="54" y="874" class="t">Public corpus</text><text x="22" y="898" class="d">proven before/after pairs, downloadable</text></g>
<g data-edge="pub->lease"><path class="e" d="M44,912 V952" stroke="#69718a" marker-end="url(#mine-data-flow-m-a0)"/>
<text class="el" x="56" y="936">pull</text>
</g>
<g data-step="lease" data-n="7"><rect class="gf-cb" x="4" y="952" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="964" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="974" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="222.6" cy="970" r="3.5" fill="#60a5fa"/><text x="318" y="974" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><circle cx="33" cy="995" r="11" fill="#3fd68a"/><text x="33" y="999.5" text-anchor="middle" class="n">7</text><text x="54" y="1000" class="t">Lease back</text><text x="22" y="1024" class="d">downloads the corpus for your next run</text></g>
<g data-edge="lease->run"><rect x="4" y="1056" width="332" height="40" rx="12" fill="#3fd68a" fill-opacity=".08" stroke="#3fd68a" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1082" class="el" style="fill:#3fd68a">↺ from 7 back to step 1</text></g>
</svg>
