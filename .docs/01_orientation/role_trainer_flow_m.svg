<svg xmlns="http://www.w3.org/2000/svg" id="role-trainer-flow-m" data-gfflow="1" viewBox="0 0 340 414" width="340" height="414" role="img" aria-labelledby="role-trainer-flow-m-t role-trainer-flow-m-d">
<title id="role-trainer-flow-m-t">The trainer loop: stake, host the daily window — ours only at launch; the reward class is designed</title>
<desc id="role-trainer-flow-m-d">3 steps in path order. 1. Stake 1K KAT: the operator bond for hosting a window (the network; planned). 2. The daily window: cron start · sleep after — the run window only (the trainer window; live). 3. Endorsements: a designed class — settles when hosts open (the trainer window; planned).</desc>
<style>#role-trainer-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#role-trainer-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-trainer-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-trainer-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-trainer-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-trainer-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#role-trainer-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="role-trainer-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="414" rx="14" fill="#11141b"/>
<g data-step="stake" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="30" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="258.6" cy="26" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="30" text-anchor="end" class="s" fill="#9299ab">planned</text><circle cx="33" cy="51" r="11" fill="#5cc8e8"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Stake 1K KAT</text><text x="22" y="80" class="d">the operator bond for hosting a window</text></g>
<g data-edge="stake->win"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#role-trainer-flow-m-a0)"/>
</g>
<g data-step="win" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="156" class="k" fill="#3fd68a">THE TRAINER WINDOW</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#3fd68a"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">The daily window</text><text x="22" y="206" class="d">cron start · sleep after — the run window only</text><rect x="22" y="216" width="196" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="230" class="s" fill="#3fd68a">runs on our replicas only</text></g>
<g data-edge="win->get"><path class="e" d="M44,250 V290" stroke="#69718a" marker-end="url(#role-trainer-flow-m-a0)"/>
</g>
<g data-step="get" data-n="3"><rect class="gf-cb" x="4" y="290" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="302" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="312" class="k" fill="#3fd68a">THE TRAINER WINDOW</text><circle cx="258.6" cy="308" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="312" text-anchor="end" class="s" fill="#9299ab">planned</text><circle cx="33" cy="333" r="11" fill="#3fd68a"/><text x="33" y="337.5" text-anchor="middle" class="n">3</text><text x="54" y="338" class="t">Endorsements</text><text x="22" y="362" class="d">a designed class — settles when hosts open</text><rect x="22" y="372" width="167.2" height="20" rx="10" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="30" y="386" class="s" fill="#5cc8e8">local models: unarmed</text></g>
</svg>
