<svg xmlns="http://www.w3.org/2000/svg" id="kat-economy-flow-m" data-gfflow="1" viewBox="0 0 340 902" width="340" height="902" role="img" aria-labelledby="kat-economy-flow-m-t kat-economy-flow-m-d">
<title id="kat-economy-flow-m-t">The KAT economy: the meter runs locally, burns fund the pool, the settle pays the fleet — and the corpus leases back</title>
<desc id="kat-economy-flow-m-d">6 steps in path order. 1. The run is metered: counts code-word tokens; logged out = never billed (your machine; live). 2a. If trial credit left · logged in: TUNA pays first: one grant · 30 days — funds nothing, expires (the ledger; test network). 2b. If after TUNA · logged in: KAT pays: after the trial — metered totals, signed (the ledger; test network). 3. If burns: The mining pool: every KAT burn funds the next epoch&#x27;s rewards (the ledger; test network). 4. If the epoch closes: The settle pays: rows mint — mining = processing, minted = paid (miners; test network). 5. If the corpus grows: The lease-back: the fleet corpus refreshes every machine (your machine; test network). From 5 back to 1: every machine refines better.</desc>
<style>#kat-economy-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#kat-economy-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#kat-economy-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#kat-economy-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#kat-economy-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#kat-economy-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#kat-economy-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="kat-economy-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="902" rx="14" fill="#11141b"/>
<g data-step="meter" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="162" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="138" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">The run is metered</text><text x="22" y="80" class="d">counts code-word tokens; logged out = never</text><text x="22" y="98" class="d">billed</text><rect x="22" y="110" width="289.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="124" class="el">→ 2a · trial credit left · logged in</text><rect x="22" y="136" width="239.2" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="150" class="el">→ 2b · after TUNA · logged in</text></g>
<g data-edge="meter->tuna"><path class="e" d="M44,170 V210" stroke="#69718a" marker-end="url(#kat-economy-flow-m-a0)"/>
<text class="el" x="56" y="194">trial credit left · logged in</text>
</g>
<g data-step="tuna" data-n="2a"><rect class="gf-cb" x="4" y="210" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="222" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="232" class="k" fill="#5cc8e8">THE LEDGER</text><circle cx="222.6" cy="228" r="3.5" fill="#60a5fa"/><text x="318" y="232" text-anchor="end" class="s" fill="#60a5fa">test network</text><rect x="22" y="242" width="29.6" height="22" rx="11" fill="#5cc8e8"/><text x="36.8" y="257.5" text-anchor="middle" class="n">2a</text><text x="61.6" y="258" class="t">TUNA pays first</text><text x="22" y="282" class="d">one grant · 30 days — funds nothing, expires</text></g>
<g data-edge="meter->kat"><path class="e" d="M44,302 V330" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="320">↳ from 1 · after TUNA · logged in</text></g>
<g data-step="kat" data-n="2b"><rect class="gf-cb" x="4" y="336" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="348" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="358" class="k" fill="#5cc8e8">THE LEDGER</text><circle cx="222.6" cy="354" r="3.5" fill="#60a5fa"/><text x="318" y="358" text-anchor="end" class="s" fill="#60a5fa">test network</text><rect x="22" y="368" width="30.4" height="22" rx="11" fill="#5cc8e8"/><text x="37.2" y="383.5" text-anchor="middle" class="n">2b</text><text x="62.4" y="384" class="t">KAT pays</text><text x="22" y="408" class="d">after the trial — metered totals, signed</text></g>
<g data-edge="kat->pool"><path class="e" d="M44,422 V462" stroke="#69718a" marker-end="url(#kat-economy-flow-m-a0)"/>
<text class="el" x="56" y="446">burns</text>
</g>
<g data-step="pool" data-n="3"><rect class="gf-cb" x="4" y="462" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="474" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="484" class="k" fill="#5cc8e8">THE LEDGER</text><circle cx="222.6" cy="480" r="3.5" fill="#60a5fa"/><text x="318" y="484" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="505" r="11" fill="#5cc8e8"/><text x="33" y="509.5" text-anchor="middle" class="n">3</text><text x="54" y="510" class="t">The mining pool</text><text x="22" y="534" class="d">every KAT burn funds the next epoch&#x27;s rewards</text></g>
<g data-edge="pool->settle"><path class="e" d="M44,548 V588" stroke="#69718a" marker-end="url(#kat-economy-flow-m-a0)"/>
<text class="el" x="56" y="572">the epoch closes</text>
</g>
<g data-step="settle" data-n="4"><rect class="gf-cb" x="4" y="588" width="332" height="104" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="600" width="4" height="80" rx="2" fill="#5cc8e8"/><text x="22" y="610" class="k" fill="#5cc8e8">MINERS</text><circle cx="222.6" cy="606" r="3.5" fill="#60a5fa"/><text x="318" y="610" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="631" r="11" fill="#5cc8e8"/><text x="33" y="635.5" text-anchor="middle" class="n">4</text><text x="54" y="636" class="t">The settle pays</text><text x="22" y="660" class="d">rows mint — mining = processing, minted =</text><text x="22" y="678" class="d">paid</text></g>
<g data-edge="settle->lease"><path class="e" d="M44,692 V732" stroke="#69718a" marker-end="url(#kat-economy-flow-m-a0)"/>
<text class="el" x="56" y="716">the corpus grows</text>
</g>
<g data-step="lease" data-n="5"><rect class="gf-cb" x="4" y="732" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="744" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="754" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="222.6" cy="750" r="3.5" fill="#60a5fa"/><text x="318" y="754" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="775" r="11" fill="#3fd68a"/><text x="33" y="779.5" text-anchor="middle" class="n">5</text><text x="54" y="780" class="t">The lease-back</text><text x="22" y="804" class="d">the fleet corpus refreshes every machine</text></g>
<g data-edge="lease->meter"><rect x="4" y="836" width="332" height="58" rx="12" fill="#3fd68a" fill-opacity=".08" stroke="#3fd68a" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="862" class="el" style="fill:#3fd68a">↺ from 5 back to step 1 · every machine</text><text x="22" y="880" class="el" style="fill:#3fd68a">refines better</text></g>
</svg>
