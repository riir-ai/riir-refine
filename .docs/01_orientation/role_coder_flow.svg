<svg xmlns="http://www.w3.org/2000/svg" id="role-coder-flow" data-gfflow="1" viewBox="0 0 1168 382" width="1168" height="382" role="img" aria-labelledby="role-coder-flow-t role-coder-flow-d">
<title id="role-coder-flow-t">The coder loop: dry-run first, then the compile-gated fix — the meter draws TUNA before KAT</title>
<desc id="role-coder-flow-d">5 steps in path order. 1. Install: one prebuilt binary lands in ~/.cargo/bin (your machine; live). 2. Dry run: lists the fixes it would make, writes nothing (your machine; live). 3. The compile gate: kept only if your crate still compiles (your machine; live). 4a. Fixed code: clippy · perf · docker · dist + compile errors (your machine; live). 4b. If logged in: The burn meter: fair use only — local fixes are free; TUNA first where funded (the billing plane; live).</desc>
<style>#role-coder-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#role-coder-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#role-coder-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-coder-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-coder-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-coder-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-coder-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-coder-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#role-coder-flow .e{fill:none;stroke-width:1.6}#role-coder-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="role-coder-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1168" height="382" rx="14" fill="#11141b"/>
<g data-lane="me"><rect x="10" y="12" width="1148" height="180" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#3fd68a">YOUR MACHINE</tspan><tspan class="ln" dx="12">every run · free · private</tspan></text></g>
<g data-lane="bill"><rect x="10" y="204" width="1148" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="229"><tspan class="lh" fill="#5cc8e8">THE BILLING PLANE</tspan><tspan class="ln" dx="12">logged-in runs only</tspan></text></g>
<g data-edge="inst->dry"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#role-coder-flow-a0)"/></g>
<g data-edge="dry->fix"><path class="e" d="M554,108 618,108" stroke="#69718a" marker-end="url(#role-coder-flow-a0)"/></g>
<g data-edge="fix->get"><path class="e" d="M848,108 912,108" stroke="#69718a" marker-end="url(#role-coder-flow-a0)"/></g>
<g data-edge="fix->meter"><path class="e" d="M733,162 733,300 912,300" stroke="#69718a" marker-end="url(#role-coder-flow-a0)"/><text class="el" x="822.5" y="291" text-anchor="middle">logged in</text></g>
<g data-step="inst" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#3fd68a"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Install</text><text x="46" y="109" class="d">one prebuilt binary lands in</text><text x="46" y="128" class="d">~/.cargo/bin</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="dry" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#3fd68a"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">Dry run</text><text x="340" y="109" class="d">lists the fixes it would make,</text><text x="340" y="128" class="d">writes nothing</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text><rect x="331.5" y="168" width="215" height="22" rx="11" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="439" y="183.5" text-anchor="middle" class="s" fill="#3fd68a">logged out = nothing charged</text></g>
<g data-step="fix" data-n="3"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="640" cy="78" r="12" fill="#3fd68a"/><text x="640" y="82.5" text-anchor="middle" class="n">3</text><text x="662" y="83" class="t">The compile gate</text><text x="634" y="109" class="d">kept only if your crate still</text><text x="634" y="128" class="d">compiles</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="get" data-n="4a"><rect class="gf-cb" x="912" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="922" y="66" width="29.6" height="24" rx="12" fill="#3fd68a"/><text x="936.8" y="82.5" text-anchor="middle" class="n">4a</text><text x="961.6" y="83" class="t">Fixed code</text><text x="928" y="109" class="d">clippy · perf · docker · dist +</text><text x="928" y="128" class="d">compile errors</text><circle cx="932" cy="146" r="4" fill="#4ade80"/><text x="942" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="meter" data-n="4b"><rect class="gf-cb" x="912" y="246" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="922" y="258" width="30.4" height="24" rx="12" fill="#5cc8e8"/><text x="937.2" y="274.5" text-anchor="middle" class="n">4b</text><text x="962.4" y="275" class="t">The burn meter</text><text x="928" y="301" class="d">fair use only — local fixes are free;</text><text x="928" y="320" class="d">TUNA first where funded</text><circle cx="932" cy="338" r="4" fill="#4ade80"/><text x="942" y="342" class="s" fill="#4ade80">live</text></g>
</svg>
