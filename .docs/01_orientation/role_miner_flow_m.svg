<svg xmlns="http://www.w3.org/2000/svg" id="role-miner-flow-m" data-gfflow="1" viewBox="0 0 340 810" width="340" height="810" role="img" aria-labelledby="role-miner-flow-m-t role-miner-flow-m-d">
<title id="role-miner-flow-m-t">The contributor loop: redacted records up, proof at real clippy, points at the epoch settle — and the corpus leases back</title>
<desc id="role-miner-flow-m-d">5 steps in path order. 1. Join once: cargo refine join — consent · login · first sync (your machine; live). 2. The redacted batch: verdicts + touched snippets, secret-scanned, signed (your machine; live). 3. If sync: Proof queue: rows are verified at a real clippy re-run (riir.ai). 4a. If pays: Points at the settle: the pool pays — contributing = processing, proven = paid (riir.ai). 4b. If grows: The corpus grows: the network&#x27;s observed pattern classes (riir.ai). From 4b back to 2: leased back — your own retrieval improves.</desc>
<style>#role-miner-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#role-miner-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-miner-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-miner-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-miner-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-miner-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#role-miner-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="role-miner-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="810" rx="14" fill="#11141b"/>
<g data-step="join" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="30" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#3fd68a"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Join once</text><text x="22" y="80" class="d">cargo refine join · consent · sync</text><rect x="22" y="90" width="157.6" height="20" rx="10" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="30" y="104" class="s" fill="#3fd68a">opt-in · reversible</text></g>
<g data-edge="join->bat"><path class="e" d="M44,124 V164" stroke="#69718a" marker-end="url(#role-miner-flow-m-a0)"/>
</g>
<g data-step="bat" data-n="2"><rect class="gf-cb" x="4" y="164" width="332" height="104" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="176" width="4" height="80" rx="2" fill="#3fd68a"/><text x="22" y="186" class="k" fill="#3fd68a">YOUR MACHINE</text><circle cx="280.2" cy="182" r="3.5" fill="#4ade80"/><text x="318" y="186" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="207" r="11" fill="#3fd68a"/><text x="33" y="211.5" text-anchor="middle" class="n">2</text><text x="54" y="212" class="t">The redacted batch</text><text x="22" y="236" class="d">verdicts + touched snippets, secret-scanned,</text><text x="22" y="254" class="d">signed</text></g>
<g data-edge="bat->proof"><path class="e" d="M44,268 V308" stroke="#69718a" marker-end="url(#role-miner-flow-m-a0)"/>
<text class="el" x="56" y="292">sync</text>
</g>
<g data-step="proof" data-n="3"><rect class="gf-cb" x="4" y="308" width="332" height="118" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="320" width="4" height="94" rx="2" fill="#5cc8e8"/><text x="22" y="330" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="326" r="3.5" fill="#60a5fa"/><text x="318" y="330" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><circle cx="33" cy="351" r="11" fill="#5cc8e8"/><text x="33" y="355.5" text-anchor="middle" class="n">3</text><text x="54" y="356" class="t">Proof queue</text><text x="22" y="380" class="d">rows are verified at a real clippy re-run</text><rect x="22" y="392" width="104.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="406" class="el">→ 4a · pays</text><rect x="132.8" y="392" width="112" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="140.8" y="406" class="el">→ 4b · grows</text></g>
<g data-edge="proof->pay"><path class="e" d="M44,426 V466" stroke="#69718a" marker-end="url(#role-miner-flow-m-a0)"/>
<text class="el" x="56" y="450">pays</text>
</g>
<g data-step="pay" data-n="4a"><rect class="gf-cb" x="4" y="466" width="332" height="134" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="478" width="4" height="110" rx="2" fill="#5cc8e8"/><text x="22" y="488" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="484" r="3.5" fill="#60a5fa"/><text x="318" y="488" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><rect x="22" y="498" width="29.6" height="22" rx="11" fill="#5cc8e8"/><text x="36.8" y="513.5" text-anchor="middle" class="n">4a</text><text x="61.6" y="514" class="t">Points at the settle</text><text x="22" y="538" class="d">the pool pays — contributing = processing,</text><text x="22" y="556" class="d">proven = paid</text><rect x="22" y="566" width="116.8" height="20" rx="10" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="30" y="580" class="s" fill="#5cc8e8">never re-gated</text></g>
<g data-edge="proof->grow"><path class="e" d="M44,606 V634" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="624">↳ from 3 · grows</text></g>
<g data-step="grow" data-n="4b"><rect class="gf-cb" x="4" y="640" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="652" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="662" class="k" fill="#5cc8e8">THE NETWORK</text><circle cx="222.6" cy="658" r="3.5" fill="#60a5fa"/><text x="318" y="662" text-anchor="end" class="s" fill="#60a5fa">riir.ai</text><rect x="22" y="672" width="30.4" height="22" rx="11" fill="#5cc8e8"/><text x="37.2" y="687.5" text-anchor="middle" class="n">4b</text><text x="62.4" y="688" class="t">The corpus grows</text><text x="22" y="712" class="d">the network&#x27;s observed pattern classes</text></g>
<g data-edge="grow->bat"><rect x="4" y="744" width="332" height="58" rx="12" fill="#3fd68a" fill-opacity=".08" stroke="#3fd68a" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="770" class="el" style="fill:#3fd68a">↺ from 4b back to step 2 · leased back</text><text x="22" y="788" class="el" style="fill:#3fd68a">— your own retrieval improves</text></g>
</svg>
