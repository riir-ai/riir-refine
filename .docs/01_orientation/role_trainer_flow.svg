<svg xmlns="http://www.w3.org/2000/svg" id="role-trainer-flow" data-gfflow="1" viewBox="0 0 874 382" width="874" height="382" role="img" aria-labelledby="role-trainer-flow-t role-trainer-flow-d">
<title id="role-trainer-flow-t">The trainer loop: stake, host the daily window — ours only at launch; the reward class is designed</title>
<desc id="role-trainer-flow-d">3 steps in path order. 1. Stake 1K KAT: the operator bond for hosting a window (the network; planned). 2. The daily window: cron start · sleep after — the run window only (the trainer window; live). 3. Endorsements: a designed class — settles when hosts open (the trainer window; planned).</desc>
<style>#role-trainer-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#role-trainer-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#role-trainer-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-trainer-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-trainer-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-trainer-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-trainer-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-trainer-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#role-trainer-flow .e{fill:none;stroke-width:1.6}#role-trainer-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="role-trainer-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="874" height="382" rx="14" fill="#11141b"/>
<g data-lane="net"><rect x="10" y="12" width="854" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#5cc8e8">THE NETWORK</tspan><tspan class="ln" dx="12">the stake · designed</tspan></text></g>
<g data-lane="win"><rect x="10" y="190" width="854" height="180" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#3fd68a">THE TRAINER WINDOW</tspan><tspan class="ln" dx="12">ours today · third parties planned</tspan></text></g>
<g data-edge="stake->win"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#role-trainer-flow-a0)"/></g>
<g data-edge="win->get"><path class="e" d="M554,286 618,286" stroke="#69718a" marker-end="url(#role-trainer-flow-a0)"/></g>
<g data-step="stake" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#5cc8e8"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Stake 1K KAT</text><text x="46" y="109" class="d">the operator bond for hosting</text><text x="46" y="128" class="d">a window</text><circle cx="50" cy="146" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="60" y="150" class="s" fill="#9299ab">planned</text></g>
<g data-step="win" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#3fd68a"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">The daily window</text><text x="340" y="287" class="d">cron start · sleep after — the</text><text x="340" y="306" class="d">run window only</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text><rect x="331.5" y="346" width="215" height="22" rx="11" fill="#3fd68a" fill-opacity=".12" stroke="#3fd68a" stroke-opacity=".55"/><text x="439" y="361.5" text-anchor="middle" class="s" fill="#3fd68a">runs on our replicas only</text></g>
<g data-step="get" data-n="3"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#3fd68a"/><text x="640" y="260.5" text-anchor="middle" class="n">3</text><text x="662" y="261" class="t">Endorsements</text><text x="634" y="287" class="d">a designed class — settles</text><text x="634" y="306" class="d">when hosts open</text><circle cx="638" cy="324" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="648" y="328" class="s" fill="#9299ab">planned</text><rect x="641.1" y="346" width="183.8" height="22" rx="11" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="733" y="361.5" text-anchor="middle" class="s" fill="#5cc8e8">local models: unarmed</text></g>
</svg>
