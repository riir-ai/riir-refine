<svg xmlns="http://www.w3.org/2000/svg" id="role-fixer-flow-m" data-gfflow="1" viewBox="0 0 340 712" width="340" height="712" role="img" aria-labelledby="role-fixer-flow-m-t role-fixer-flow-m-d">
<title id="role-fixer-flow-m-t">The fixer loop: the operator drains the queue today; third-party replay is designed and settles nothing yet</title>
<desc id="role-fixer-flow-m-d">5 steps in path order. 1. Unproven queue: pushed rows await proof (the unproven queue; test network). 2a. If the operator lane today: The drain lane: hosted LLM drafts · cap-guarded · redaction-gated (the operator&#x27;s nodes; live). 2b. If designed · not open yet: Replay, your rig: lease fixes, re-run gates, K=2 verifier (your rig; planned). 3. The gates: compile gate + the real clippy oracle (the operator&#x27;s nodes; live). 4. Pays on the board: accepted work settles through the miner rows (the unproven queue; live).</desc>
<style>#role-fixer-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#role-fixer-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-fixer-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-fixer-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-fixer-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-fixer-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#role-fixer-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="role-fixer-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="712" rx="14" fill="#11141b"/>
<g data-step="q" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="144" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="120" rx="2" fill="#5cc8e8"/><text x="22" y="30" class="k" fill="#5cc8e8">THE UNPROVEN QUEUE</text><circle cx="222.6" cy="26" r="3.5" fill="#60a5fa"/><text x="318" y="30" text-anchor="end" class="s" fill="#60a5fa">test network</text><circle cx="33" cy="51" r="11" fill="#5cc8e8"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Unproven queue</text><text x="22" y="80" class="d">pushed rows await proof</text><rect x="22" y="92" width="241.6" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="106" class="el">→ 2a · the operator lane today</text><rect x="22" y="118" width="246.4" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="132" class="el">→ 2b · designed · not open yet</text></g>
<g data-edge="q->drain"><path class="e" d="M44,152 V192" stroke="#69718a" marker-end="url(#role-fixer-flow-m-a0)"/>
<text class="el" x="56" y="176">the operator lane today</text>
</g>
<g data-step="drain" data-n="2a"><rect class="gf-cb" x="4" y="192" width="332" height="104" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="204" width="4" height="80" rx="2" fill="#3fd68a"/><text x="22" y="214" class="k" fill="#3fd68a">THE OPERATOR&#x27;S NODES</text><circle cx="280.2" cy="210" r="3.5" fill="#4ade80"/><text x="318" y="214" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="224" width="29.6" height="22" rx="11" fill="#3fd68a"/><text x="36.8" y="239.5" text-anchor="middle" class="n">2a</text><text x="61.6" y="240" class="t">The drain lane</text><text x="22" y="264" class="d">hosted LLM drafts · cap-guarded ·</text><text x="22" y="282" class="d">redaction-gated</text></g>
<g data-edge="q->rep"><path class="e" d="M44,302 V330" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="320">↳ from 1 · designed · not open yet</text></g>
<g data-step="rep" data-n="2b"><rect class="gf-cb" x="4" y="336" width="332" height="116" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="348" width="4" height="92" rx="2" fill="#3fd68a"/><text x="22" y="358" class="k" fill="#3fd68a">YOUR RIG</text><circle cx="258.6" cy="354" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="358" text-anchor="end" class="s" fill="#9299ab">planned</text><rect x="22" y="368" width="30.4" height="22" rx="11" fill="#3fd68a"/><text x="37.2" y="383.5" text-anchor="middle" class="n">2b</text><text x="62.4" y="384" class="t">Replay, your rig</text><text x="22" y="408" class="d">lease fixes, re-run gates, K=2 verifier</text><rect x="22" y="418" width="174.4" height="20" rx="10" fill="#5cc8e8" fill-opacity=".12" stroke="#5cc8e8" stroke-opacity=".55"/><text x="30" y="432" class="s" fill="#5cc8e8">cut = 0 until ratified</text></g>
<g data-edge="rep->gates"><path class="e" d="M44,452 V492" stroke="#69718a" marker-end="url(#role-fixer-flow-m-a0)"/>
</g>
<g data-edge="drain->gates"><path class="e" d="M44,458 V486" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="476">↳ from 2a</text></g>
<g data-step="gates" data-n="3"><rect class="gf-cb" x="4" y="492" width="332" height="86" rx="12" fill="#161a23" stroke="#3fd68a" stroke-opacity=".6"/><rect x="4" y="504" width="4" height="62" rx="2" fill="#3fd68a"/><text x="22" y="514" class="k" fill="#3fd68a">THE OPERATOR&#x27;S NODES</text><circle cx="280.2" cy="510" r="3.5" fill="#4ade80"/><text x="318" y="514" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="535" r="11" fill="#3fd68a"/><text x="33" y="539.5" text-anchor="middle" class="n">3</text><text x="54" y="540" class="t">The gates</text><text x="22" y="564" class="d">compile gate + the real clippy oracle</text></g>
<g data-edge="gates->pay"><path class="e" d="M44,578 V618" stroke="#69718a" marker-end="url(#role-fixer-flow-m-a0)"/>
</g>
<g data-step="pay" data-n="4"><rect class="gf-cb" x="4" y="618" width="332" height="86" rx="12" fill="#161a23" stroke="#5cc8e8" stroke-opacity=".6"/><rect x="4" y="630" width="4" height="62" rx="2" fill="#5cc8e8"/><text x="22" y="640" class="k" fill="#5cc8e8">THE UNPROVEN QUEUE</text><circle cx="280.2" cy="636" r="3.5" fill="#4ade80"/><text x="318" y="640" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="661" r="11" fill="#5cc8e8"/><text x="33" y="665.5" text-anchor="middle" class="n">4</text><text x="54" y="666" class="t">Pays on the board</text><text x="22" y="690" class="d">accepted work settles through the miner rows</text></g>
</svg>
