<svg xmlns="http://www.w3.org/2000/svg" id="role-fixer-flow" data-gfflow="1" viewBox="0 0 1168 560" width="1168" height="560" role="img" aria-labelledby="role-fixer-flow-t role-fixer-flow-d">
<title id="role-fixer-flow-t">The fixer loop: the operator drains the queue today; third-party replay is designed and settles nothing yet</title>
<desc id="role-fixer-flow-d">5 steps in path order. 1. Unproven queue: pushed rows await proof (the unproven queue; live on riir.ai). 2a. If the operator lane today: The drain lane: hosted LLM drafts · cap-guarded · redaction-gated (the operator&#x27;s nodes; live). 2b. If designed · not open yet: Replay, your rig: lease fixes, re-run gates, K=2 verifier (your rig; planned). 3. The gates: compile gate + the real clippy oracle (the operator&#x27;s nodes; live). 4. Pays on the board: accepted work settles through the contributor rows (the unproven queue; live).</desc>
<style>#role-fixer-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#role-fixer-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#role-fixer-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-fixer-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#role-fixer-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#role-fixer-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#role-fixer-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#role-fixer-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#role-fixer-flow .e{fill:none;stroke-width:1.6}#role-fixer-flow .eb{fill:none;stroke-width:2}</style>
