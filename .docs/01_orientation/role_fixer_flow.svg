<rect width="1168" height="560" rx="14" fill="#11141b"/>
<g data-lane="fleet"><rect x="10" y="12" width="1148" height="166" rx="16" fill="#5cc8e8" fill-opacity=".06" stroke="#5cc8e8" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#5cc8e8">THE UNPROVEN QUEUE</tspan><tspan class="ln" dx="12">the network side</tspan></text></g>
<g data-lane="ops"><rect x="10" y="190" width="1148" height="166" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#3fd68a">THE OPERATOR&#x27;S NODES</tspan><tspan class="ln" dx="12">live today</tspan></text></g>
<g data-lane="rig"><rect x="10" y="368" width="1148" height="180" rx="16" fill="#3fd68a" fill-opacity=".06" stroke="#3fd68a" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#3fd68a">YOUR RIG</tspan><tspan class="ln" dx="12">the max tier · designed</tspan></text></g>
<g data-edge="q->drain"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#role-fixer-flow-a0)"/><text class="el" x="278" y="99" text-anchor="start">the operator lane today</text></g>
