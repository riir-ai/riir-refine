# cargo-deny configuration — the supply-chain advisories gate (riir-refine pilot).
# Landed with Batch 294 / Plan 298 / Research 332 (the wasmtime RUSTSEC-2026-0380
# + RUSTSEC-2026-0379 distill). Division of labor (the sec corpus header's own
# line, with deny as the tool of record): cargo-deny owns vulnerable CRATES
# (lockfile surface); the sec corpus owns vulnerable USAGE (code-span classes).
#
# Scope decision: ADVISORIES ONLY are gated (`cargo deny check advisories`).
# licenses/bans/sources keep tool defaults until the fan-out plan adjudicates
# them per repo — the gate's job today is "no known-vulnerable crate resolves
# in this lockfile".
#
# The ignore list is a MEMBERSHIP PIN: every row carries a reason + a tracking
# reference (the workspace pin-with-reason convention). A bare ignore entry
# with no reason is a defect in this file. This repo's list is deliberately
# empty — the first pinned row lands together with the reason that earns it.

[advisories]
version = 2
# The ignore ledger is a MEMBERSHIP PIN: every row carries a reason (the v2
# table form renders it in `cargo deny` output). A bare ignore entry with no
# reason is a defect in this file. Adjudication discipline: a finding is
# either FIXED (bump the dep chain) or PINNED here with its reason — never
# silenced silently.
ignore = [
    # RUSTSEC-2023-0089 — atomic-polyfill is UNMAINTAINED (archived repo), not
    # vulnerable; "no safe upgrade is available". Transitive via katgpt-core →
    # postcard 1.x → heapless 0.7; the fix lives upstream (heapless 0.8 /
    # postcard bump in katgpt-rs), tracked there. Measured 2026-10-26,
    # cargo-deny 0.20.2: v2's `unmaintained`/`yanked` keys are SCOPE selectors
    # (all/workspace/transitive/none), not severities, and there is no
    # [lints.rustsec] severity table in 0.20.2 — so unmaintained rows fail the
    # gate and are adjudicated per-row through this ledger.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained, not vulnerable; transitive via katgpt-core→postcard→heapless 0.7; fix is upstream (heapless/postcard bump, katgpt-rs lane)" },
]
