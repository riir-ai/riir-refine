[package]
name = "riir-clippy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Clippy-healing drafter+pruner pipeline: modelless ternary drafter x rust-analyzer validator x additive self-evolution loop (LoRA fallback deferred)"
publish = false

[lib]
name = "riir_clippy"
path = "src/lib.rs"

[dependencies]
# Public substrate: ConstraintPruner trait + ternary SIMD matvec
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }

# Serialization for corpus freeze/thaw (BLAKE3-committed)
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stage 2 adaptive drafter: lock-free pool (per AGENTS.md: papaya over Arc<RwLock<HashMap>>).
papaya = "0.2"

# Issue 025 T2: native regex for the non-syn WGSL surface scanner (the only
# sanctioned new dep per the issue's anti-goals — already in the tree
# transitively via riir-rag under `latent_retrieval`; optional so the default
# build stays dependency-light).
regex = { version = "1", optional = true }

# L2 pruner: pure Rust syntax parser (modelless, zero ML).
# L3 ruliology search: AST delta-size computation via `syn::visit`.
# `visit` feature gates the AST traversal walker; `full` + `parsing` are
# already required by the L2 pruner. Already in Cargo.lock transitively.
# `visit-mut` + `printing` added for Stage 2 AST-rewrite proposers (Issue 010).
# `extra-traits` for Eq/Debug on syn types in tests.
syn = { version = "2", default-features = false, features = ["full", "parsing", "derive", "visit", "visit-mut", "printing", "extra-traits", "clone-impls"] }

# Stage 2 proposers: AST rewrites via TokenStream round-trip.
# `span-locations` (Plan 005 Phase 6): byte offsets on fallback spans —
# `syn::parse_file` in a normal lib populates real byte ranges, enabling the
# span-preserving patch emitter (`SourceEdit` splice, no whole-file reformat).
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# ── Ternary inference arm (Bench 010) ────────────────────────────────────
# Real katgpt ternary generation on the clippy task, so llama.cpp can be
# compared against OUR inference stack rather than against the retriever.
# Optional + feature-gated: these are heavy sibling crates and the default
# build must stay dependency-light.
riir-engine = { path = "../riir-ai/crates/riir-engine", optional = true, default-features = false, features = ["deltanet_ternary_inference"] }
riir-gpu = { path = "../riir-ai/crates/riir-gpu", optional = true, default-features = false, features = ["cubecl_runtime", "ternary_gemv", "ternary_gemm_simdgroup", "ternary_gemm_batched", "metal_tensor_gemm", "speculative_decode"] }

# Plan 005 Phase 1: latent retrieval substrate for the `--suggest` MVP.
# AstChunker (fn/impl/struct spans) + ModellessEmbedder (BLAKE3+DFT+sigmoid,
# modelless) + NeuronDbRetriever (ShardIndex Clifford-wedge KNN + BM25).
# Composed as-is — zero retrieval code reimplemented locally.
# Optional + feature-gated (`latent_retrieval`): pulls the
# riir-neuron-db path dep transitively; the default build stays light.
riir-rag = { path = "../riir-ai/crates/riir-rag", optional = true, default-features = false, features = ["ast_chunker", "neuron_db"] }
# Plan 005 T3.5: the BM25 `Tokenizer` trait, so `RustOpTokenizer` can be
# injected via `NeuronDbRetriever::with_bm25_tokenizer` (a designed substrate
# hook). Already pulled transitively by riir-rag/neuron_db — this only makes
# the trait nameable; it adds nothing to the dep tree.
riir-neuron-db = { path = "../riir-neuron-db", optional = true, default-features = false, features = ["bm25"] }
# NOTE: metal_tensor_gemm (Issue 663 T5, +1.21× prefill on M3 Metal) needs the
# vendored wgpu-hal fork (adds `raw_handle()` on metal::Buffer). The fork lives
# at `riir-ai/vendor/wgpu-hal-30.0.0/`. Per cargo's patch-inheritance rules,
# `[patch.crates-io]` is only honored at the workspace root cargo is invoked
# from — so we duplicate the patch declarations below pointing at the sibling
# riir-ai vendor paths. Same trick for cubecl-runtime + cubecl-wgpu (the
# arithmetic-overflow fix + the raw-handle accessors).

[dev-dependencies]

[features]
default = ["clippy_lints", "rust_perf", "self_evolve"]

# Domain features (Plan 001 multi-domain framework refactor).
# clippy_lints is the first domain; default-on. Phase 2 adds `rust_perf`
# (promoted to default-on 2026-08-13 after the perf-bench Pareto validator
# GOAT gate passed — Bench 013 G1+G5). Phase 3 adds `kernel_heal`.
clippy_lints = []

# Phase 2: rust performance healing domain (rust-optimize skill checklist
# + nnethercote/perf-book + rustc-hash/bevy real-world patterns). DEFAULT-ON
# since 2026-08-13 (Bench 013 GOAT G1+G5 PASS). 4 of 31 benchable
# rules (`precompute-table`, `papaya-lockfree`, `dedupe-hashset-vs-vec`,
# `reuse-allocation-clear`) carry `context_notes` annotations recording that
# the bench validator found them ParetoDominated or Mixed in the default
# config — consumers should treat annotated rules as context-dependent,
# not unconditional suggestions.
rust_perf = []

# Perf rule resolution verification via real `cargo test` re-run (Phase 2).
# Opt-in because it's slow (seconds), requires cargo on PATH, and does
# temp-dir I/O. The fast path (L2 syntax check) stays always-on.
# Implies `rust_perf` (uses the perf verifier).
rust_perf_verify = ["rust_perf"]

# Perf-bench Pareto validator (Plan 001 Phase 2 GOAT gate).
# Generates microbenchmarks at multiple input sizes + reports a Pareto verdict
# (faster on N of M sizes). This is the **promotion gate** for `rust_perf`.
# Opt-in because it's slow (seconds per rule — spawns cargo build + run),
# requires cargo on PATH, and microbenchmarks are inherently noisy.
# Implies `rust_perf` (adds the BenchSpec field to PerfRule).
rust_perf_bench = ["rust_perf"]

# Phase 3: GPU kernel optimization healing domain (absorbs Proposal 012).
# Opt-in (default-off). 4090 LoRA (L4) deferred to riir-train. Not promoted
# to default until a domain-specific GOAT (real corpus + full numeric
# validator) passes.
# Enables `variable_rank_domain_expert` on katgpt-core for the latent-MoE
# expert router (`pick_domain`, Plan 558). Also gates `dep:regex` for the
# Issue 025 T2 WGSL scanner (`kernel_opt::wgsl_scan`).
kernel_heal = ["katgpt-core/variable_rank_domain_expert", "dep:regex"]

# Plan 005 Phase 1: real-file span-level latent retrieval (`--suggest` MVP).
# Indexes every enabled domain's corpus via riir-rag, routes spans via
# domain centroids, retrieves ranked rules. ZERO proposer code — suggestions
# are the corpus pattern texts. `--fix` needs the Phase 4/5 proposers.
# Opt-in: heavy dep tree (riir-rag + riir-neuron-db + syn-pulled chunker).
latent_retrieval = ["dep:riir-rag", "dep:riir-neuron-db"]

# Issue 015: `--fix --verify` — the compile gate as tooling. Apply edits,
# cargo check --all-targets, map rustc JSON errors to files/lines, revert
# only the offending edits (line-matched span-level), re-check, report.
# Under --verify the vec-with-capacity usize gate loosens (plain-path
# bounds attempted; E0308 backs the revert) + redundant_closure returns
# as an attempted lint (VERIFY_LINTS). Implies latent_retrieval (extends
# the cargo-heal bin surface).
fix_verify = ["latent_retrieval"]

# Plan 336 T4.4/T5.3: the L4 generative fallback stage. Ships the composition
# SEAM only (trait + pipeline wiring) — no model, no GPU, no heavy deps. Inert
# unless a fallback is installed via `HealPipeline::with_l4_fallback`.
# Opt-in per the promotion rule: default-on requires Plan 336's G1-G4 to pass,
# and G1 is unproven (riir-train Bench 462/465).
l4_lora = []

# Plan 005 T3.5 option 3: 768-D Bonsai dense rerank on top of the 8-D
# ShardIndex pre-filter. HEAVY — loads the ~6.7 GB Ternary-Bonsai-27B GGUF
# and runs a CPU ternary forward pass per embedded text. NEVER default; the
# modelless path is the permanent floor (riir-rag's own G5 rule). Exists so
# the T3.5 contingency's third option is measurable, not assumed.
bonsai_retrieval = ["latent_retrieval", "riir-rag/bonsai_embedder"]

# Kernel rule resolution verification via CubeCL compile (Phase 3).
# **STUB** — currently delegates to the shared RustAnalyzerPruner (syntax
# check only). Full CubeCL compile + numeric compare vs reference deferred
# (Proposal 012 §Phase 0). Implies `kernel_heal`.
kernel_verify = ["kernel_heal"]

# Lint resolution verification via real `cargo clippy` re-run (Phase 3).
# Opt-in because it's slow (seconds), requires cargo+clippy on PATH, and
# does temp-dir I/O. The fast path (L2 syntax check) stays always-on.
# Implies `clippy_lints` (uses the clippy verifier + proposers).
clippy_verify = ["clippy_lints"]

# Ruliology candidate enumeration (L3 refinement layer).
# Implies `clippy_lints` (searches over clippy corpus entries).
ruliology_search = ["clippy_lints"]

# WASM rust-analyzer pruner (L2 sandboxed variant — deferred on rubrc maturity)
wasm_pruner = []

# Adaptive LoRA fallback (L4 — deferred to riir-train; opt-in when ready)
clippy_lora = []

# Bench 010: katgpt ternary generation (GPU-resident forward, Metal via CubeCL)
# measured on the SAME clippy prompts llama.cpp is given. Opt-in: pulls
# riir-engine + riir-gpu and needs the Bonsai GGUF at runtime.
ternary_inference = ["dep:riir-engine", "dep:riir-gpu"]

# Issue 004 + Issue 008: latent-first self-evolution loop (memory + EMA direction update).
# DEFAULT-ON since Issue 018 (promotion with graceful oracle degradation): the
# memory half runs wherever fixes are applied + persists across runs; the EMA
# learning half no-ops with one log line when the clippy_verify oracle is
# unavailable. The modules are UNCONDITIONAL — this flag is a back-compat alias
# so the benches'/examples' required-features lists keep resolving; a build
# with --no-default-features still gets the full layer.
# Validated: G1-G5 PASS (Issue 004) + G6/G7 real cargo clippy PASS (Issue 008):
# G6 10/10 corpus truthfulness, G7 50.0pp improvement (50% → 100%).
# Opt-out (pure loop): RIIR_HEAL_SELF_EVOLVE=0.
self_evolve = []

[[bench]]
name = "bench_001_l1_matvec"
harness = false
required-features = ["clippy_lints"]

[[bench]]
name = "bench_002_l2_pruner_syn"
harness = false

# Phase 3 GOAT gate lives in examples/ to avoid the benches/ auto-target conflict.
# Run with: cargo run --example clippy_verify_demo --features clippy_verify --release

[[example]]
name = "heal_demo"
required-features = ["clippy_lints"]

# Phase 2: rust_perf domain demo. Validates the scaffold end-to-end.
[[example]]
name = "perf_heal_demo"
required-features = ["rust_perf"]

# Phase 2 GOAT gate: perf-bench Pareto validator across the benchable corpus.
# Runs generated microbenchmarks for 31/39 rules + reports Pareto verdicts.
# SLOW — spawns cargo build + run per rule (seconds each).
[[example]]
name = "perf_bench_demo"
required-features = ["rust_perf_bench"]

[[example]]
name = "clippy_verify_demo"
required-features = ["clippy_verify"]

# Phase 3: kernel_opt domain demo. Demonstrates the routed heal pipeline:
# router → narrowed candidates → drafter → validator + thermal tier.
# Closes the Plan 003/004 gap (router was corpus-wired but never called in
# runnable code). Run with:
#   cargo run --example kernel_heal_demo --features kernel_heal
[[example]]
name = "kernel_heal_demo"
required-features = ["kernel_heal"]

# Issue 025 T2: WGSL scanner calibration smoke (default = the riir-gpu
# kernels dir). Run with:
#   cargo run --example wgsl_scan_smoke --features kernel_heal -- [dir]
[[example]]
name = "wgsl_scan_smoke"
required-features = ["kernel_heal"]

# Issue 025 T6: the WGSL/cube git-history mining harness (default+experimental
# patterns; the diff adjudicates). Same gating as wgsl_scan_smoke — the
# scanner lives behind kernel_heal.
[[example]]
name = "wgsl_mine"
required-features = ["kernel_heal"]

[[example]]
name = "ruliology_search_demo"
required-features = ["ruliology_search"]

# Issue 008: real-world validation of self_evolve via cargo clippy ground truth.
# Requires both self_evolve + clippy_verify. SLOW — spawns cargo clippy dozens of times.
[[example]]
name = "self_evolve_real_world_demo"
required-features = ["self_evolve", "clippy_verify"]

# Issue 010: Stage 2 tuning demo. Populates the adaptive pool via cargo clippy
# re-run (off-hot-path tuning loop). Slow — spawns cargo clippy per case.
[[example]]
name = "stage2_tuning_demo"
required-features = ["self_evolve", "clippy_verify"]

# E2E tokens/sec harness (Bonsai/llama.cpp head-to-head denominator).
# Emits JSONL of (lint, emitted fix, latency); tokens are counted externally by
# scripts/bench_bonsai_vs_clippy_tokps.py using the SAME Bonsai tokenizer, so
# both arms share one numerator unit. MODE=l1l2|self_evolve selects the path.
[[bench]]
name = "bench_e2e_tokps"
harness = false
required-features = ["self_evolve", "clippy_lints"]

# Bench 010: llama.cpp vs katgpt ternary, both generating on clippy prompts.
[[bench]]
name = "bench_clippy_ternary_tps"
harness = false
required-features = ["ternary_inference"]

# Plan 005 Phase 2: the unified `cargo heal` CLI (suggest mode). Named
# `cargo-heal` so an installed copy gets the `cargo heal` subcommand UX.
# Gated on latent_retrieval (the matcher + indexes live behind it) AND
# rust_perf (the --fix proposers live behind it — Phase 6 T6.1).
[[bin]]
name = "cargo-heal"
path = "src/bin/heal.rs"
required-features = ["latent_retrieval", "rust_perf", "clippy_lints"]

# ─────────────────────────────────────────────────────────────────────────────
# Local patches — mirror riir-ai/Cargo.toml's [patch.crates-io] so the
# metal_tensor_gemm + cubecl_runtime features compile from THIS workspace.
# Cargo's patch-inheritance does NOT cross workspace boundaries, so when we
# invoke cargo from riir-clippy we have to redeclare them here pointing at
# the sibling riir-ai vendor paths. Remove once upstream lands the fixes
# (cubecl tracel-ai/cubecl#1359, cubecl-wgpu raw-handle PR, wgpu-hal
# raw_handle PR).
# ─────────────────────────────────────────────────────────────────────────────
[patch.crates-io]
cubecl-runtime = { path = "../riir-ai/vendor/cubecl-runtime-0.11.0-pre.2" }
cubecl-wgpu = { path = "../riir-ai/vendor/cubecl-wgpu-0.11.0-pre.2" }
wgpu-hal = { path = "../riir-ai/vendor/wgpu-hal-30.0.0" }
