required-features = ["self_evolve", "clippy_verify"]

# Plan 342 T4.1: labeled-corpus probe. Imports the clippy_lints proposers
# (E0432 under --all-targets --no-default-features without this gate — the
# gate-coverage lesson: an example reaching a feature-gated module needs its
