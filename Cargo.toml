# ─────────────────────────────────────────────────────────────────────────────
# Local patches — mirror the riir-infer workspace's [patch.crates-io] so the
# metal_tensor_gemm + cubecl_runtime features compile from THIS workspace.
# Cargo's patch-inheritance does NOT cross workspace boundaries, so when we
# invoke cargo from riir-refine we have to redeclare them here. Since the
# T2.3 retarget (reflex Issue 008) the ternary lane's inference crates come
# from ../riir-infer, so the vendor rows point at THAT repo's copies — the
# same byte-identical forks its own CI builds against. Remove once upstream
# lands the fixes (cubecl tracel-ai/cubecl#1359, cubecl #1806 idle-server
# park @ 6bba5fdf0 — no release carries it yet, drop on the first cubecl
# release past 0.11.0, wgpu-hal raw_handle PR).
# ─────────────────────────────────────────────────────────────────────────────
[patch.crates-io]
cubecl-runtime = { path = "../riir-infer/vendor/cubecl-runtime-0.11.0-pre.2" }
cubecl-common = { path = "../riir-infer/vendor/cubecl-common-0.11.0-pre.2" }
wgpu-hal = { path = "../riir-infer/vendor/wgpu-hal-30.0.0" }
# The cubecl-wgpu fork row (as_raw_metal_* accessors) is GONE: it existed for
# the old riir-gpu edge; the moved riir-infer-gpu metal_tensor family never
# calls the fork API (measured, S6) so plain crates.io cubecl-wgpu compiles.

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles — dev debuginfo budget (riir-ai .issues/723 Phase 1)
# ─────────────────────────────────────────────────────────────────────────────
# macOS defaults to `split-debuginfo = "unpacked"`, so DWARF lands in the
# per-CGU `.o` files under target/debug/deps — measured at 23.39 GB across
# 143,294 files in riir-ai alone. Two dev-only levers, measured on a clean
# `cargo build -p katgpt-core --lib` (57 packages):
#
#   stock                                   376.4 MB total / 80.6 MB .o / 16s
#   dev.debug = "line-tables-only"          333.4 MB / 51.8 MB / 11s
#   dev.package."*".debug = false           363.5 MB / 73.5 MB / 14s
#   both (adopted here)                     324.9 MB / 47.1 MB / 10s
#                                           => -13.7% total, -41.6% .o bytes
#
# Counterintuitive result, reproduced twice: setting package."*".debug to
# "line-tables-only" instead of `false` measures WORSE than either lever alone
# (366.1 MB / 75.8 MB). Re-measure before "improving" it that way.
#
# `release` and `bench` already default to debug = false (verified: the release
# binary has an empty .debug_info), so they need no entry here.
#
# Tradeoff: dependencies — including sibling path deps such as katgpt-core when
# built from riir-ai — carry no debuginfo, so backtraces through them lose
# file:line. Delete the package."*" block for a debugger session that needs it.
# `line-tables-only` keeps file:line for first-party code but drops locals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Proposal 003 G2 (Plan 105): the release binary ships to the PUBLIC dist repo
# (gist-rs/cargo-heal) — ship it stripped. Measured 2026-09-06: the unstripped
# shipping binary (default + latent_retrieval) exposed 14,485 symbols, i.e. the
# full internal architecture. `debug` already defaults to false in release
# (the profile.dev note above); this additionally removes the symbol TABLE.
[profile.release]
strip = true

# Size-optimized DIST profile for the SHIPPED cargo-refine binary (Proposal 003
# release lane) — invoked via `cargo build --profile dist`. Deliberately NOT
# [profile.release]: profile.bench inherits release, and opt-level="s" +
# codegen-units=1 would poison the GOAT criterion benches (bench_001_l1_matvec
# et al). Measured 2026-09-09 (arm64, the v0.1.4 shipping feature set
# latent_retrieval,kat_service,kat_transport,fix_verify, /tmp isolated target):
# plain release (strip only) = 11.0 MB → dist (this block) = 4.3 MB (-61%).
# cargo bloat breakdown first: 70% of .text is riir_refine's own code (corpus
# tables inlined as giant static functions), 13% syn — so the win comes from
# codegen knobs, not dep removal. Perf trade (opt-level "s" vs 3) is dev-time
# only — the LOCAL dev global binary stays on plain `--release` for drafter
# speed; re-measure with `cargo refine --score-bench` before ever switching the
# dev binary to dist.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

