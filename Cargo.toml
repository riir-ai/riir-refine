[package]
name = "riir-refine"
version = "0.3.3"
edition = "2021"
# The shipped binary is proprietary freeware (binary-only distribution): the
# EULA it ships with is its licence. The source is private.
license-file = "release/LICENSE.md"
description = "Clippy-healing drafter+pruner pipeline: modelless ternary drafter x rust-analyzer validator x additive self-evolution loop (LoRA fallback deferred)"
publish = false

[lib]
name = "riir_refine"
path = "src/lib.rs"

[dependencies]
# Public substrate: ConstraintPruner trait + ternary SIMD matvec
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core", features = ["entropic_tilt", "rating"] }
# Issue 093 T1: NonergodicFilter kernel (katgpt-rs Plan 592) for the
# per-run strategy-posterior PoC. Already in the graph transitively via
# katgpt-core's default features (bom_sampling -> micro_belief) — this row
# adds the direct path + the `nonergodic_belief` gate the PoC consumes.
# Optional, opt-in `nonergodic_poc` only.
katgpt-micro-belief = { path = "../katgpt-rs/crates/katgpt-micro-belief", version = "0.2.1", optional = true, features = ["nonergodic_belief"] }
# Plan 199 T3.2: the WASM validator lane's substrate — the percepta MVP
# decoder + lowering pipeline (`percepta_wasm`). Optional, opt-in
# `wasm_validator` only; good_lp / percepta_compile stay off (the T3.1
# decision: percepta-decoder + an authored fuel-bounded interpreter, wasmi
# refused on cost). BOUNDARY.md carries the allowlist row (same commit).
katgpt-percepta = { path = "../katgpt-rs/crates/katgpt-percepta", optional = true, default-features = false, features = ["percepta_wasm"] }
# Plan 202 R4: the vessel verify path — ONE artifact protocol across the
# stack (instinct Proposal 001 A1/A8, via the public format repo's crate).
# Optional, opt-in `vessel_artifacts` only. `default-features = false` +
# `vessel_public_read` ONLY: the hosted reader never compiles into this
# publicly-distributed binary (the moat — hosted vessels refuse at peek,
# structurally). Verify-only by law: refine NEVER mints (A8 — minting is
# riir-train's offline lane) and NEVER embeds vessel bytes (A10 — the
# compiled-in corpora stay code-sealed; the artifact-dir leak test pins it).
reflexer-vessel = { path = "../riir-reflexer/crates/reflexer-vessel", optional = true, default-features = false, features = ["vessel_public_read"] }

# Serialization for corpus freeze/thaw (BLAKE3-committed)
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stage 2 adaptive drafter: lock-free pool (per AGENTS.md: papaya over Arc<RwLock<HashMap>>).
papaya = "0.2"

# Issue 025 T2: native regex for the non-syn WGSL surface scanner (the only
# sanctioned new dep per the issue's anti-goals — already in the tree
# transitively via riir-rag under `latent_retrieval`; optional so the default
# build stays dependency-light).
regex = { version = "1", optional = true }

# Plan 134 T0.3: the shader_perf domain's Tier-1 oracle — naga, the
# gfx-rs WGSL validator (bevy's front-end; already in the lock at 30.0.1
# via the optional riir-gpu/wgpu arm, so enabling it adds ZERO new
# packages). Optional so the default build stays dependency-light; only
# `shader_verify` pulls it (wgsl-in front-end; `valid` is unconditional
# in naga 30).
naga = { version = "30.0.1", optional = true, default-features = false, features = ["wgsl-in"] }

# L2 pruner: pure Rust syntax parser (modelless, zero ML).
# L3 ruliology search: AST delta-size computation via `syn::visit`.
# `visit` feature gates the AST traversal walker; `full` + `parsing` are
# already required by the L2 pruner. Already in Cargo.lock transitively.
# `visit-mut` + `printing` added for Stage 2 AST-rewrite proposers (Issue 010).
# `extra-traits` for Eq/Debug on syn types in tests.
syn = { version = "2", default-features = false, features = ["full", "parsing", "derive", "visit", "visit-mut", "printing", "extra-traits", "clone-impls"] }

# Stage 2 proposers: AST rewrites via TokenStream round-trip.
# `span-locations` (Plan 005 Phase 6): byte offsets on fallback spans —
# `syn::parse_file` in a normal lib populates real byte ranges, enabling the
# span-preserving patch emitter (`SourceEdit` splice, no whole-file reformat).
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# Issue 040 (fixer re-gate POC): blocking HTTP client for the CF Workers AI
# REST arms. Optional + feature-gated (`cf_workers_ai`) — third-party crates
# are NOT boundary-gated (the kat_service precedent), and the default build
# stays untouched. Default features = rustls TLS (api.cloudflare.com).
# Still a ROOT dep post-issue-088: the kat transports moved to riir-kat, but
# cf_workers_ai + groq_first live here and name ureq directly.
ureq = { version = "2.9", optional = true, features = ["json"] }

# Issue 153 T2: the self-update verifies the downloaded archive against the
# release's SHA256SUMS (the dist format is sha256 — the house blake3 rule
# applies to OUR storage, not to verifying a third-party-format manifest).
sha2 = { version = "0.10", optional = true, default-features = false }

# (issue 088: the ssh-key row moved to riir-kat with the account + stake
# clients — riir-refine no longer names ssh_key anywhere.)

# Proposal 008 T2.4 legacy comment — REMOVED with the vote client (issue
# 088): the kat service plane moved to the sibling leaf crate `riir-kat`
# (2026-09-10), which carries ssh-key/ed25519/qrcode/ureq in its own tier
# features. Root keeps ONLY what root-side code still names directly:
# ed25519-dalek (`kat_sync_payload` signs) + ureq (`cf_workers_ai`/
# `groq_first`).
ed25519-dalek = { version = "2", optional = true, default-features = false }

# Issue 088 (2026-09-10): the kat service-plane leaf crate — wire protocol +
# units + hosts + the machine-local trio (feature-free PROTOCOL tier) + the
# client plane + the HTTP transports. NON-optional with default-features =
# false, and root needs NO member feature in its own default: everything
# root re-exports ungated (kat_mining_consent / kat_service_config /
# kat_soft_gate / kat_units / kat_service_urls + the protocol tier) is in
# the member's feature-free tier, so root's default build compiles exactly
# the surface HEAD compiled. `kat_service` = ["riir-kat/client"] gates the
# signing/client surfaces; `kat_transport` adds
# "riir-kat/kat_transport". Root dep rows for ssh-key / qrcode / riir-auth
# are GONE (the member carries them); root keeps ed25519-dalek
# (kat_sync_payload signs) + ureq (cf_workers_ai / groq_first).
riir-kat = { path = "../riir-kat", default-features = false, features = ["redact"] }

# Proposal 011 Phase 1 T1.6: the QR dep moved to riir-kat with the lease
# client (issue 088). Root no longer names qrcode.

# ── Ternary inference arm (Bench 010) ────────────────────────────────────
# Real katgpt ternary generation on the clippy task, so llama.cpp can be
# compared against OUR inference stack rather than against the retriever.
# Optional + feature-gated: heavy sibling crates, the default build stays
# dependency-light.
# Plan 610 S6 / reflex Issue 008 T2.3: retargeted to the riir-infer repo
# (the public LLM-inference substrate) — this repo's ternary lane no longer
# touches riir-ai at all; loaders/tokenizers/kernels/drafters all resolve
# there, at the same feature names the engine/gpu pair exposed.
riir-infer-core = { path = "../riir-infer", optional = true, default-features = false, features = ["deltanet_ternary_inference"] }
riir-infer-gpu = { path = "../riir-infer/crates/riir-infer-gpu", optional = true, default-features = false, features = ["cubecl_runtime", "ternary_gemv", "ternary_gemm_simdgroup", "ternary_gemm_batched", "metal_tensor_gemm", "speculative_decode"] }

# Plan 005 Phase 1: latent retrieval substrate for the `--suggest` MVP.
# AstChunker (fn/impl/struct spans) + ModellessEmbedder (BLAKE3+DFT+sigmoid,
# modelless) + NeuronDbRetriever (ShardIndex Clifford-wedge KNN + BM25).
# Composed as-is — zero retrieval code reimplemented locally.
# Optional + feature-gated (`latent_retrieval`): pulls the
# riir-neuron-db path dep transitively; the default build stays light.
riir-rag = { path = "../riir-neuron-db/crates/riir-rag", optional = true, default-features = false, features = ["ast_chunker", "neuron_db"] }
# The Bonsai-27B dense embedder arm (carved out of riir-rag by riir-ai
# Issue 1038 — it needs riir-engine, which stays an riir-ai-internal edge).
# It forwards riir-rag/dense_embed, so `bonsai_retrieval` keeps the dense
# channel enabled without naming it here.
riir-rag-bonsai = { path = "../riir-ai/crates/riir-rag-bonsai", optional = true, default-features = false }
# Plan 005 T3.5: the BM25 `Tokenizer` trait, so `RustOpTokenizer` can be
# injected via `NeuronDbRetriever::with_bm25_tokenizer` (a designed substrate
# hook). Already pulled transitively by riir-rag/neuron_db — this only makes
# the trait nameable; it adds nothing to the dep tree.
# `local_kv` joined for Plan 019 T4.3 (the durable trajectory store — the
# same substrate riir-dapps/riir-games persist through).
riir-neuron-db = { path = "../riir-neuron-db", optional = true, default-features = false, features = ["bm25", "local_kv"] }
# Issue 124: the shared LLM transport leaf (the Issue-051/106 extraction,
# same shape as the riir-kat move) — wire URL/body/parse/classify + the
# free-tier ladder walk + the ureq client (both timeouts, bearer scrub).
# Protocol tier is wasm32-safe; `transport` is native-only (ureq), enabled
# by groq_first + cf_workers_ai. Pricing/spend/windowed-router policy stay
# HERE (llm_spend + the LlmRouter) — see the leaf's BOUNDARY.md.
riir-llm = { path = "../riir-llm", optional = true, default-features = false }
# NOTE: metal_tensor_gemm (Issue 663 T5, +1.21× prefill on M3 Metal) needs the
# vendored wgpu-hal fork (adds `raw_handle()` on metal::Buffer). The fork lives
# at `riir-ai/vendor/wgpu-hal-30.0.0/`. Per cargo's patch-inheritance rules,
# `[patch.crates-io]` is only honored at the workspace root cargo is invoked
# from — so we duplicate the patch declarations below pointing at the sibling
# riir-ai vendor paths. Same trick for cubecl-runtime + cubecl-wgpu (the
# arithmetic-overflow fix + the raw-handle accessors).

# Issue 126 follow-up: the topup picker's raw-mode key reader (unix
# termios via libc — already in the lock transitively, zero new packages).
# A `[target]` table closes the [dependencies] one; keep it last.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# serde_json: already a main dep (zero new tree cost) — the 038 e2e parses
# --dump-trajectories JSONL rows.
serde_json = "1"
# log: already in the lock as a transitive of every kat_transport/ureq build
# (zero new packages) — the Batch-143 G1 gate exercises the REAL macro
# semantics (log_enabled! + lazy format args) rather than a hand-rolled
# level-atomic model.
log = "0.4"
# T2.4 vote-client fixtures sign/verify directly. Already in the tree for
# every kat_service build via ssh-key's ed25519 feature + the direct
# optional dep above — zero new packages (dev-deps unify to the same
# instance).
ed25519-dalek = "2"

[features]
default = ["clippy_lints", "rust_perf", "self_evolve", "docker", "rustc_errors", "dist"]

# Issue 122 PoC: the PowerPlay frontier miner — modelless generator at the
# capability frontier (unsolved-before / solved-after / regression-green /
# exactly-once, clippy-oracle-verified). Opt-in; GOAT pending (Plan 145).
# Implies score_bench (heal_fixpoint_cfg + ComponentOverride) and
# clippy_lints (stock regression rows). Read-only over the seed corpus.
frontier_miner = ["clippy_lints", "score_bench"]

# Domain features (Plan 001 multi-domain framework refactor).
# clippy_lints is the first domain; default-on. Phase 2 adds `rust_perf`
# (promoted to default-on 2026-08-13 after the perf-bench Pareto validator
# GOAT gate passed — Bench 013 G1+G5). Phase 3 adds `kernel_opt`.
# `dist` joined default 2026-09-13 (Issue 085 promotion — see its comment).
clippy_lints = []

# Phase 2: rust performance healing domain (rust-optimize skill checklist
# + nnethercote/perf-book + rustc-hash/bevy real-world patterns). DEFAULT-ON
# since 2026-08-13 (Bench 013 GOAT G1+G5 PASS). 4 of 31 benchable
# rules (`precompute-table`, `papaya-lockfree`, `dedupe-hashset-vs-vec`,
# `reuse-allocation-clear`) carry `context_notes` annotations recording that
# the bench validator found them ParetoDominated or Mixed in the default
# config — consumers should treat annotated rules as context-dependent,
# not unconditional suggestions.
rust_perf = []

# Perf rule resolution verification via real `cargo test` re-run (Phase 2).
# Opt-in because it's slow (seconds), requires cargo on PATH, and does
# temp-dir I/O. The fast path (L2 syntax check) stays always-on.
# Implies `rust_perf` (uses the perf verifier).
rust_perf_verify = ["rust_perf"]

# Perf-bench Pareto validator (Plan 001 Phase 2 GOAT gate).
# Generates microbenchmarks at multiple input sizes + reports a Pareto verdict
# (faster on N of M sizes). This is the **promotion gate** for `rust_perf`.
# Opt-in because it's slow (seconds per rule — spawns cargo build + run),
# requires cargo on PATH, and microbenchmarks are inherently noisy.
# Implies `rust_perf` (adds the BenchSpec field to PerfRule).
rust_perf_bench = ["rust_perf"]

# Phase 3: GPU kernel optimization healing domain (absorbs Proposal 012).
# Opt-in (default-off). 4090 LoRA (L4) deferred to riir-train. Not promoted
# to default until a domain-specific GOAT (real corpus + full numeric
# validator) passes.
# Enables `variable_rank_domain_expert` on katgpt-core for the latent-MoE
# expert router (`pick_domain`, Plan 558). Also gates `dep:regex` for the
# Issue 025 T2 WGSL scanner (`kernel_opt::wgsl_scan`).
kernel_opt = ["katgpt-core/variable_rank_domain_expert", "dep:regex"]

# Plan 202 R1 (2026-10-07): the escalation manifest — the operator-owned
# ARMING surface for per-domain escalation (`.refine/escalation_manifest.json`),
# consuming the SHARED katgpt-core `escalation_guard` primitive (Issue 923:
# RollingRateLatch cost-ceiling shape + the exact-literal demote-only decode
# RIIR_REFINE_ESC=0). Manifest-only arming, demote-only switches, max_rate as
# the ONLY rate knob (the miss rate is coverage-decided — low is good, never
# a demotion trigger). Ships ALL-EMPTY (absent file = zero behavior). The
# transports (R2 HostedExpertL4 / R3a seat rerank) register INTO it, never in
# code. Opt-in until the R6 arm-H outcome-based selection measures a winner.
escalation_manifest = ["katgpt-core/escalation_guard"]

# Plan 621 Phase 5 T5.2 (2026-10-11): the probe-gated half of the rescue
# lane — katgpt-core `state_probe` (the FlyBy probe kernel + Phase-2
# classifier) consumed over the rescue tallies' ACCUMULATED b0 leg. The raw
# keep predicate (`b0 = 0 ∧ bd ≥ 3`, Issue 156's pinned truth table) stays
# byte-identical and UNGATED; this feature adds the escalation ADVICE
# (knowledge-like / productive / undetermined over the attempt counts) + the
# `--misses` probe-b0 column. Augment-only: the advice can narrow the arm-H
# escalation queue, never admit. Opt-in until the first ARMED arm-H run
# produces the real-telemetry re-gate (Plan 621 T5.4).
rescue_probe = ["katgpt-core/state_probe"]

# Plan 202 R4 (2026-10-08): the vessel verify path — refine's runtime
# artifacts verify through the SAME protocol the decision stack uses (sign /
# blake3 / monotonic apply / strict refusal on tamper — A1/A8). Verify-only
# seam: operator pins via RIIR_REFINE_VESSEL_PUBKEY (the reflex wildcard
# pattern; the compiled pin table stays EMPTY until the first release
# artifact ships — the reflexer DEFAULT_PINS law), strict
# downgrade/fork-refusing monotonic apply. R2's HostedExpertL4 + the
# escalation lane's artifact pins are the designed consumers. Opt-in until
# a real artifact adopts it (the l4_lora seam-first precedent).
vessel_artifacts = ["dep:reflexer-vessel"]

# Plan 005 Phase 1: real-file span-level latent retrieval (`--suggest` MVP).
# Indexes every enabled domain's corpus via riir-rag, routes spans via
# domain centroids, retrieves ranked rules. ZERO proposer code — suggestions
# are the corpus pattern texts. `--fix` needs the Phase 4/5 proposers.
# Opt-in: heavy dep tree (riir-rag + riir-neuron-db + syn-pulled chunker).
latent_retrieval = ["dep:riir-rag", "dep:riir-neuron-db"]

# Issue 162 T2 — the formatting-churn certificate for the retrieval channel.
# Forwards katgpt-core `basis_split` (Plan 625) so the format-flip instrument
# can fit the fix-pair variant basis and read its held-out `pair_leakage`
# residual. Mirrors reflex's same-named feature (the cross-repo vocabulary).
# Opt-in: report-only today; a projected-KNN lane (T3) would gate on it.
basis_cert = ["katgpt-core/basis_split"]

# Issue 121 (katgpt-rs Plan 599 T4.2 — the first consumer of katgpt-core's
# `set_admission` primitive): counter-anchored SET rerank of the merged
# seven-domain span pool. The fan-out merge (`all_rules`' flat score sort)
# is an unanchored set decision — one rule family can fill every slot; this
# arm admits the slate greedily under alignment x diversity x groundedness
# (Sherman-Morrison logdet + colinearity cap), certifies it with the exact
# cosine-kernel Vendi score, and re-fans the theta-ladder when the
# certificate flags collapse. `detect_collapse` (family entropy) stays the
# EVAL axis, never the guard. Opt-in pending the A/B verdict (Bench 096);
# same-binary kill-switch: RIIR_CLIPPY_NO_SET_RERANK=1 (the NO_TWO_STAGE
# precedent).
set_rerank = ["katgpt-core/set_admission", "latent_retrieval"]

# katgpt-rs Issue 882 P0 rider (Research 586): differential-anchor query
# correction on the 8-D latent leg — `q̂ = q − λ·ā` with ā the per-domain
# mean-CORPUS embedding (katgpt-core `differential_anchor`). The 8-D
# ModellessEmbedder is sigmoid-bounded (positive orthant), so raw cosine
# carries a large common-mode floor; the anchor subtracts it. λ=0 (the
# default) is byte-identical — the correction is skipped entirely. Opt-in
# pending the A/B verdict (tests/differential_anchor_ab.rs).
differential_anchor = ["katgpt-core/differential_anchor", "latent_retrieval"]

# Issue 139 T3 (katgpt-rs Issue 913 consumer): the censoring disclosure on the
# `--frontier-report` band mass. band-mass is conditioned on a verdict having
# landed (n>=1); the line adds the decomposition population-mass =
# P(seen) x E[band | seen], katgpt-core's `filter_bias_bound` budget (Gamma =
# 1/2 for a centred band indicator => the budget is P(unseen)) and the exact
# count hull. Report-only, gates nothing; off = byte-identical report.
noise_weighted_evidence = ["katgpt-core/grouped_evidence_weighting"]

# Issue 134 T2 — the pool-depth allocation gate: scale the suggest lane's
# per-domain retrieval pool + truncation K by the measured demonstrability
# constant (Research 585 / SAT arXiv:2609.22682 — depth pays where selection
# discriminates). Budget-conserving across the MEASURED domains; unmeasured
# stay at exactly 1.0. Default-off through T3 (the issue's kill-switch
# discipline); runtime override RIIR_REFINE_DEMONSTRABILITY=0 guards the
# auto-arm path. Byte-identical when off OR unarmed. Implies
# latent_retrieval (the matcher seam).
demonstrability_gate = ["latent_retrieval"]

# Issue 062 T3 (Bench 063): TPR role-filler structure fit over the healer
# corpus. Enables katgpt-core's `tpr` primitive (Issue 707) and measures
# whether a TPR artifact is *admissible* on this corpus at all before T4
# wires a projection into the reranker — `m*d >= D` makes the fit reproduce
# every training state, so an OOD number read off it is content-free.
# Opt-in and measurement-only: no default code path, no retrieval path
# touched. `latent_retrieval` supplies the 8-D consumer state embedder
# (`riir_rag::ModellessEmbedder`), which is the arm whose result can feed T4.
# `kernel_opt` is in the set for the corpus, not the healer: it is what gates
# `domains::kernel_opt`, whose rules over their DECLARED categories are the
# one arm whose role is not derived from the span text (Issue 062 T5b). Listed
# rather than cfg'd away in the test, because an arm that silently disappears
# on a feature is the vacuous-instrument failure this bench exists to avoid.
tpr_structure = ["katgpt-core/tpr", "latent_retrieval", "clippy_lints", "kernel_opt"]

# Issue 092 T1: cross-domain rule-corpus alignment PoC (GW on rule-similarity
# spaces). Enables katgpt-core's `gw_alignment` primitive (Plan 594, opt-in)
# and gates `examples/gw_corpus_poc.rs` — the defend-wrong harness (GW
# correspondence map vs name/keyword baseline vs no-alignment base rate over
# the clippy_lints (49) × rust_perf (126) corpora). OFFLINE corpus-curation
# instrumentation only: no heal-path, no router (cross_domain_routing.md's
# scoping verdict stands). Opt-in, measurement-only, report-first
# (R135/Bench-047 doctrine — no wiring until the PoC verdict).
gw_corpus = ["katgpt-core/gw_alignment", "clippy_lints", "rust_perf"]

# Issue 125: the CUA-S1 specialist option-scorer PoC — a trained tinyx
# clone (byte-level, ~700k params) as a CHALLENGER arm against the shipped
# modelless `RerankMode::Structural` rerank on healer rule selection.
# Research 573 (the open Jev recipe) is the source; Bench 096's 85.2%
# composite top-1 is the baseline to beat. Gates
# `examples/choice_scorer_poc.rs` (render/train/eval/selftest) + the model
# module `src/draft/choice_scorer.rs` (forward/backward/AdamW + gradient
# checks). Opt-in, measurement-only: the modelless default is NOT
# challenged until the GOAT gates pass (G1/G1-OOD/G2/control/calibration);
# a Bench-065 memorization signature = REFUTED, no widen-and-retry.
choice_scorer_poc = ["latent_retrieval", "clippy_lints", "rust_perf"]

# Issue 126 lane (a): the sigmoid-NCE two-tower span↔rule embeddings
# (φ(span)ᵀψ(rule) ≈ P(rule fixes span)) trained on the machine-checked
# fixture+corpus supervision with a rule-level withheld split, shipped as a
# versioned BLAKE3-verified frozen i8 artifact. The runtime stays modelless
# (one hashed bag + matvec, one dot + σ per rule). Implies choice_scorer_poc
# (shared Rng + warmup/cosine schedule). Gates `examples/rule_embed_poc.rs`
# (train/eval) + `run_split_eval` (retrieval_eval). Opt-in, measurement-only:
# G2 = withheld hits-at-1 must BEAT the hashed baseline, G1 = zero top-1
# regressions on baseline-correct spans, G3 = clean-span false-positive
# profile no worse.
rule_embed_poc = ["choice_scorer_poc"]

# Issue 133 T1 (2026-10-08): the Matryoshka-k randomized-budget supervision
# arms for the two-tower scorer — span-structured BCE whose candidate
# weights come from `katgpt_core::exact_mass_admit` (Σσ = k by bisection) at
# a per-step budget draw (uniform / log_both). Measurement-only, on top of
# the shipped `rule_embed_poc` posture (implies it — same towers, same
# artifact wire, same `run_split_eval` gates); never in the heal path.
# Gates `examples/rule_embed_mattr_t1.rs` + `draft::rule_embed_mattr`.
mattr_k_poc = ["rule_embed_poc", "katgpt-core/exact_mass_admit"]

# Issue 169 T0 (Research 309 FLINT): the multi-vector kill-test — per-op-token
# hashed embeddings (D ∈ {8,32,64}) scored by the SHIPPED katgpt-core
# `maxsim_score`, vs the shipped single-vector matcher, on the oracle
# retrieval_eval fixtures. Measurement-only (`examples/multivector_poc.rs` +
# `draft::multivector`); implies latent_retrieval (the matcher + fixtures it
# measures against) and forwards katgpt-core/maxsim for the scoring kernel —
# PoC-scoped, never default (the T2 discipline: the feature rides the PoC
# feature set only).
multivector_poc = ["latent_retrieval", "katgpt-core/maxsim"]

# Issue 097: linking↔retrieval-confusion PoC — does topological linking
# (PCA-3D, katgpt-core's Issue-757-tuned detector) between two rules'
# span-embedding clouds predict retrieval top-1 confusion between those
# rules? The Ren & Lim CIFAR-10 analogue (linking ↔ confusion, r≈0.48)
# translated to the healer surface. Gates examples/linking_confusion_poc.rs
# — the defend-wrong harness (rename-orbit clouds over the oracle-labeled
# fixtures, Fisher + Spearman per domain, verdict banner). Measurement-only,
# no heal-path, no router; opt-in per the gw_corpus precedent. GO unblocks
# the Research 391 deferred guides (a runtime consumer for the detector);
# NO-GO retires the fusion idea with the orbit-manifold caveat on record.
linking_confusion_poc = ["katgpt-core/linking_fold_detector", "latent_retrieval", "clippy_lints", "rust_perf"]

# Issue 093 T1: per-run strategy-posterior PoC — NonergodicFilter
# (katgpt-rs Plan 592, opt-in) over strategy/error-class generators vs the
# SHIPPED static shape-conditional BetaPosterior ordering (the real
# `shape_conditional_order` over a seeded TrajStore) vs no-posterior
# (min-delta). Gates `examples/nonergodic_driver_poc.rs` — defend-wrong toy
# corpus, scripted outcomes, report-first (R135/Bench-047 doctrine; no
