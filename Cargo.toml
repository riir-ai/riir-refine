[package]
name = "riir-clippy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Clippy-healing drafter+pruner pipeline: modelless ternary drafter x rust-analyzer validator x additive self-evolution loop (LoRA fallback deferred)"
publish = false

[lib]
name = "riir_clippy"
path = "src/lib.rs"

[dependencies]
# Public substrate: ConstraintPruner trait + ternary SIMD matvec
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }

# Serialization for corpus freeze/thaw (BLAKE3-committed)
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stage 2 adaptive drafter: lock-free pool (per AGENTS.md: papaya over Arc<RwLock<HashMap>>).
papaya = "0.2"

# L2 pruner: pure Rust syntax parser (modelless, zero ML).
# L3 ruliology search: AST delta-size computation via `syn::visit`.
# `visit` feature gates the AST traversal walker; `full` + `parsing` are
# already required by the L2 pruner. Already in Cargo.lock transitively.
# `visit-mut` + `printing` added for Stage 2 AST-rewrite proposers (Issue 010).
# `extra-traits` for Eq/Debug on syn types in tests.
syn = { version = "2", default-features = false, features = ["full", "parsing", "derive", "visit", "visit-mut", "printing", "extra-traits", "clone-impls"] }

# Stage 2 proposers: AST rewrites via TokenStream round-trip.
proc-macro2 = "1"
quote = "1"

# ── Ternary inference arm (Bench 010) ────────────────────────────────────
# Real katgpt ternary generation on the clippy task, so llama.cpp can be
# compared against OUR inference stack rather than against the retriever.
# Optional + feature-gated: these are heavy sibling crates and the default
# build must stay dependency-light.
riir-engine = { path = "../riir-ai/crates/riir-engine", optional = true, default-features = false, features = ["deltanet_ternary_inference"] }
riir-gpu = { path = "../riir-ai/crates/riir-gpu", optional = true, default-features = false, features = ["cubecl_runtime", "ternary_gemv"] }

[dev-dependencies]

[features]
default = ["clippy_lints", "rust_perf"]

# Domain features (Plan 001 multi-domain framework refactor).
# clippy_lints is the first domain; default-on. Phase 2 adds `rust_perf`
# (promoted to default-on 2026-08-13 after the perf-bench Pareto validator
# GOAT gate passed — Bench 013 G1+G5). Phase 3 adds `kernel_heal`.
clippy_lints = []

# Phase 2: rust performance healing domain (rust-optimize skill checklist).
# DEFAULT-ON since 2026-08-13 (Bench 013 GOAT G1+G5 PASS). 3 of 12 benchable
# rules (`precompute-table`, `papaya-lockfree`, `dedupe-hashset-vs-vec`) carry
# `context_notes` annotations recording that the bench validator found them
# ParetoDominated or Mixed in the default config — consumers should treat
# annotated rules as context-dependent, not unconditional suggestions.
rust_perf = []

# Perf rule resolution verification via real `cargo test` re-run (Phase 2).
# Opt-in because it's slow (seconds), requires cargo on PATH, and does
# temp-dir I/O. The fast path (L2 syntax check) stays always-on.
# Implies `rust_perf` (uses the perf verifier).
rust_perf_verify = ["rust_perf"]

# Perf-bench Pareto validator (Plan 001 Phase 2 GOAT gate).
# Generates microbenchmarks at multiple input sizes + reports a Pareto verdict
# (faster on N of M sizes). This is the **promotion gate** for `rust_perf`.
# Opt-in because it's slow (seconds per rule — spawns cargo build + run),
# requires cargo on PATH, and microbenchmarks are inherently noisy.
# Implies `rust_perf` (adds the BenchSpec field to PerfRule).
rust_perf_bench = ["rust_perf"]

# Phase 3: GPU kernel optimization healing domain (absorbs Proposal 012).
# Opt-in (default-off). 4090 LoRA (L4) deferred to riir-train. Not promoted
# to default until a domain-specific GOAT (real corpus + full numeric
# validator) passes.
# Enables `variable_rank_domain_expert` on katgpt-core for the latent-MoE
# expert router (`pick_domain`, Plan 558).
kernel_heal = ["katgpt-core/variable_rank_domain_expert"]

# Kernel rule resolution verification via CubeCL compile (Phase 3).
# **STUB** — currently delegates to the shared RustAnalyzerPruner (syntax
# check only). Full CubeCL compile + numeric compare vs reference deferred
# (Proposal 012 §Phase 0). Implies `kernel_heal`.
kernel_verify = ["kernel_heal"]

# Lint resolution verification via real `cargo clippy` re-run (Phase 3).
# Opt-in because it's slow (seconds), requires cargo+clippy on PATH, and
# does temp-dir I/O. The fast path (L2 syntax check) stays always-on.
# Implies `clippy_lints` (uses the clippy verifier + proposers).
clippy_verify = ["clippy_lints"]

# Ruliology candidate enumeration (L3 refinement layer).
# Implies `clippy_lints` (searches over clippy corpus entries).
ruliology_search = ["clippy_lints"]

# WASM rust-analyzer pruner (L2 sandboxed variant — deferred on rubrc maturity)
wasm_pruner = []

# Adaptive LoRA fallback (L4 — deferred to riir-train; opt-in when ready)
clippy_lora = []

# Bench 010: katgpt ternary generation (GPU-resident forward, Metal via CubeCL)
# measured on the SAME clippy prompts llama.cpp is given. Opt-in: pulls
# riir-engine + riir-gpu and needs the Bonsai GGUF at runtime.
ternary_inference = ["dep:riir-engine", "dep:riir-gpu"]

# Issue 004 + Issue 008: latent-first self-evolution loop (memory + EMA direction update).
# Default-off (deployment constraint: clippy_verify is itself opt-in).
# G1-G5 PASS (Issue 004) + G6/G7 validated against real cargo clippy (Issue 008):
# G6 10/10 corpus truthfulness, G7 50.0pp improvement (50% → 100%).
self_evolve = []

[[bench]]
name = "bench_001_l1_matvec"
harness = false
required-features = ["clippy_lints"]

[[bench]]
name = "bench_002_l2_pruner_syn"
harness = false

# Phase 3 GOAT gate lives in examples/ to avoid the benches/ auto-target conflict.
# Run with: cargo run --example clippy_verify_demo --features clippy_verify --release

[[example]]
name = "heal_demo"
required-features = ["clippy_lints"]

# Phase 2: rust_perf domain demo. Validates the scaffold end-to-end.
[[example]]
name = "perf_heal_demo"
required-features = ["rust_perf"]

# Phase 2 GOAT gate: perf-bench Pareto validator across the benchable corpus.
# Runs generated microbenchmarks for 12/16 rules + reports Pareto verdicts.
# SLOW — spawns cargo build + run per rule (seconds each).
[[example]]
name = "perf_bench_demo"
required-features = ["rust_perf_bench"]

[[example]]
name = "clippy_verify_demo"
required-features = ["clippy_verify"]

[[example]]
name = "ruliology_search_demo"
required-features = ["ruliology_search"]

# Issue 008: real-world validation of self_evolve via cargo clippy ground truth.
# Requires both self_evolve + clippy_verify. SLOW — spawns cargo clippy dozens of times.
[[example]]
name = "self_evolve_real_world_demo"
required-features = ["self_evolve", "clippy_verify"]

# Issue 010: Stage 2 tuning demo. Populates the adaptive pool via cargo clippy
# re-run (off-hot-path tuning loop). Slow — spawns cargo clippy per case.
[[example]]
name = "stage2_tuning_demo"
required-features = ["self_evolve", "clippy_verify"]

# E2E tokens/sec harness (Bonsai/llama.cpp head-to-head denominator).
# Emits JSONL of (lint, emitted fix, latency); tokens are counted externally by
# scripts/bench_bonsai_vs_clippy_tokps.py using the SAME Bonsai tokenizer, so
# both arms share one numerator unit. MODE=l1l2|self_evolve selects the path.
[[bench]]
name = "bench_e2e_tokps"
harness = false
required-features = ["self_evolve", "clippy_lints"]

# Bench 010: llama.cpp vs katgpt ternary, both generating on clippy prompts.
[[bench]]
name = "bench_clippy_ternary_tps"
harness = false
required-features = ["ternary_inference"]
