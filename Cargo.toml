# ⛔ `[patch]` is honoured ONLY in the root manifest of the workspace being
# built. `riir-neuron-db` deps katgpt by git URL and redirects it back to the
# local checkout with its own `[patch]` — a redirect that does NOT reach us
# when riir-clippy is the build root. Without the table below, a
# `latent_retrieval` build resolves SEVEN katgpt crates twice (local path +
# git `14116501`, four commits before `roll_die v2` and the device-verify
# fixture rewrite): same name, same version, non-unifying types, compiled
# twice — in a build CI does in release (`ops_dashboard.yml`). Issue 058;
# gated by C7 in `../riir-ai/scripts/ci_boundary_contract.sh`.
#
# `katgpt-attn-match` is deliberately absent — optional and not enabled on this
# path, so patching it emits `warning: patch ... was not used in the crate graph`.
[patch."https://github.com/katopz/katgpt-rs"]
katgpt-core          = { path = "../katgpt-rs/crates/katgpt-core" }
katgpt-device-verify = { path = "../katgpt-rs/crates/katgpt-device-verify" }

# ── Issue 713 T3: `required-features` on `#![cfg]`-gated GOAT gates ─────────
#
# Every target below opens with a whole-file `#![cfg(feature = ...)]`. Without
# the row, `cargo test --test <name>` compiles it to an EMPTY binary and prints
# `running 0 tests` / `ok. 0 passed` with exit 0 — indistinguishable from a real
# pass, on the gates whose green IS the evidence for a promotion.
#
# The `#![cfg]` protects the COUNT. This protects the READER. Both are needed.
#
# `cargo test --workspace` is UNAFFECTED: cargo silently skips a target whose
# required-features are off, so this cannot red an existing workspace CI. What
# changes is that naming the target without its features now errors (exit 101)
# instead of reporting a green zero.
#
# Measured population + the instrument (katgpt-rs):
# .docs/10_audits/cfg_gated_silent_zero_pass.md, scripts/cfg_gated_target_audit.py

[[test]]
name = "g4_l4_composition"
required-features = ["l4_lora"]

