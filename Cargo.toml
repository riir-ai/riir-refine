# both arms share one numerator unit. MODE=l1l2|self_evolve selects the path.
[[bench]]
name = "bench_e2e_tokps"
harness = false
required-features = ["self_evolve", "clippy_lints"]

# Bench 003 (riir-train Plan 336 T5.1): the modelless MISS RATE — the only
# quantity that can justify or retire an L4 generative fallback, because the
# composition seam consults L4 ONLY on misses (no candidate, or non-parsing).
# A parsing-but-wrong modelless fix never reaches L4, so EM is not the metric.
# CPU-only, no GPU, no cargo clippy — fast enough to run on a busy box.
[[bench]]
name = "bench_003_modelless_miss_rate"
harness = false
required-features = ["self_evolve", "clippy_lints"]

# Bench 010: llama.cpp vs katgpt ternary, both generating on clippy prompts.
[[bench]]
name = "bench_clippy_ternary_tps"
harness = false
required-features = ["ternary_inference"]

# Plan 005 Phase 2: the unified `cargo heal` CLI (suggest mode). Named
# `cargo-heal` so an installed copy gets the `cargo heal` subcommand UX.
# Gated on latent_retrieval (the matcher + indexes live behind it) AND
# rust_perf (the --fix proposers live behind it — Phase 6 T6.1).
[[bin]]
name = "cargo-heal"
path = "src/bin/heal.rs"
required-features = ["latent_retrieval", "rust_perf", "clippy_lints"]

# Issue 040 — the fixer re-gate POC runner (arms A/B = CF Workers AI, arm C =
# the local Bonsai daemon; --dry-run = offline harness validation on planted
# fixes + golden prompt snapshots, no model needed).
[[bin]]
name = "fixer_regate"
path = "src/bin/fixer_regate.rs"
required-features = ["cf_workers_ai"]

# Plan 031 Phase A (A3) — the trainer-window LOCAL drain (T2.0's local half):
# TrajStore miss backlog → priority → modelless pre-pass → redaction gate →
# smoke → capped LLM → strict-keep verify → Certified trajectories + the
# transparency ledger row. `--dry-run` is the offline queue review (CI-able).
# Same feature gate as fixer_regate: the drain SENDS PROMPTS OFF-MACHINE and
# must never compile without the redaction gate it gates through.
[[bin]]
name = "kat_drain"
path = "src/bin/kat_drain.rs"
required-features = ["cf_workers_ai"]

# ─────────────────────────────────────────────────────────────────────────────
# Local patches — mirror riir-ai/Cargo.toml's [patch.crates-io] so the
# metal_tensor_gemm + cubecl_runtime features compile from THIS workspace.
# Cargo's patch-inheritance does NOT cross workspace boundaries, so when we
# invoke cargo from riir-clippy we have to redeclare them here pointing at
# the sibling riir-ai vendor paths. Remove once upstream lands the fixes
# (cubecl tracel-ai/cubecl#1359, cubecl-wgpu raw-handle PR, wgpu-hal
# raw_handle PR).
# ─────────────────────────────────────────────────────────────────────────────
[patch.crates-io]
cubecl-runtime = { path = "../riir-ai/vendor/cubecl-runtime-0.11.0-pre.2" }
cubecl-wgpu = { path = "../riir-ai/vendor/cubecl-wgpu-0.11.0-pre.2" }
wgpu-hal = { path = "../riir-ai/vendor/wgpu-hal-30.0.0" }

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles — dev debuginfo budget (riir-ai .issues/723 Phase 1)
# ─────────────────────────────────────────────────────────────────────────────
# macOS defaults to `split-debuginfo = "unpacked"`, so DWARF lands in the
# per-CGU `.o` files under target/debug/deps — measured at 23.39 GB across
# 143,294 files in riir-ai alone. Two dev-only levers, measured on a clean
# `cargo build -p katgpt-core --lib` (57 packages):
#
#   stock                                   376.4 MB total / 80.6 MB .o / 16s
#   dev.debug = "line-tables-only"          333.4 MB / 51.8 MB / 11s
#   dev.package."*".debug = false           363.5 MB / 73.5 MB / 14s
#   both (adopted here)                     324.9 MB / 47.1 MB / 10s
#                                           => -13.7% total, -41.6% .o bytes
#
# Counterintuitive result, reproduced twice: setting package."*".debug to
# "line-tables-only" instead of `false` measures WORSE than either lever alone
# (366.1 MB / 75.8 MB). Re-measure before "improving" it that way.
#
# `release` and `bench` already default to debug = false (verified: the release
# binary has an empty .debug_info), so they need no entry here.
#
# Tradeoff: dependencies — including sibling path deps such as katgpt-core when
# built from riir-ai — carry no debuginfo, so backtraces through them lose
# file:line. Delete the package."*" block for a debugger session that needs it.
# `line-tables-only` keeps file:line for first-party code but drops locals.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
