# riir-kat-housekeeping — hourly ops housekeeping Worker (Issue 045).
#
# What it does (cron `0 * * * *`):
#   1. Pulls container usage (billing dataset) + hourly metrics from CF
#      GraphQL for the trailing hour → computes est cost.
#   2. Pulls the day's Workers-AI neurons (the KAT mint anchor input per
#      Proposal 005 §The economics loop / §The daily trainer window).
#   3. Writes rows to KV: hour:<YYYYMMDDHH>, day:<YYYYMMDD> (aggregate),
#      latest, alert:<date>:<threshold>. NOT append-only — hour rows are
#      idempotently rewritten, and the day aggregate is recomputed from them
#      rather than accumulated (Issue 045 T7 CORRECT-1).
#      (This block used to claim a `mint_anchor:<date>` key. No such key is
#      ever written — the anchor lives INSIDE the hour row as `mint_anchor`.
#      Corrected 2026-08-29; the T6 mint swap-in would have gone looking for
#      a key that does not exist.)
#   4. GET /latest, /hours?n=, /days?n=, /status expose the rows for the
#      ops dashboard / future live mode. POST /backfill?days=&end= repairs
#      missing hour rows from GraphQL (Issue 045 T9, token-gated write).
#
# Auth: set the CF_API_TOKEN secret once (dedicated API token, scope
#   Account → Analytics : Read):
#     npx wrangler secret put CF_API_TOKEN
#
# Read-side hardening (Issue 045 T7 + T8 + T9e):
#   READ_TOKEN (optional secret) is the one read gate. Two levels:
#     * fail-OPEN while unset — liveness (/status, /latest) and the config
#       posture, so the T4 verification commands work before a token exists.
#       These cost ONE memoised KV get between them.
#     * hard (token SET and PRESENTED) — account telemetry, anything that
#       spends a KV list, and (T9e) the bulk read routes /hours + /days.
#   T9e closed the fail-open window on /hours + /days: they are the only
#   fan-out routes here (up to 168 KV gets for ONE request) and the memo that
#   blunted that is per-ISOLATE, so colo-spread traffic missed it every time.
#   ~595 anonymous requests would exhaust the 100k/day KV read tier, and what
#   breaks when reads run out is the day aggregate and the alert-dedupe get —
#   i.e. anonymous traffic could silently disable budget alerting. Verified
#   first that nothing consumes them: the ops dashboard makes exactly ONE
#   cross-origin call, /latest, and renders its charts from a statically baked
#   blob. They now 403 (not 401) while READ_TOKEN is unset — matching
#   /backfill's existing "a costly route does not fail open" rule.
#   /latest + /status still emit the MINIMISED projection
#   (ts/hour/ok/mint/neurons/est_usd) to an unauthenticated caller. Set with:
#     npx wrangler secret put READ_TOKEN
#   ALLOWED_ORIGINS (var) is the CORS allowlist; was `*`, which let any page
#   in any browser read this account cost telemetry cross-origin.
# The wrangler OAuth token rotates hourly and CANNOT be used here.
# Until the secret is set, the cron still writes heartbeat rows (proof the
# schedule is alive; doubles as the dashboard T9 staleness signal).
#
# Cost: $0 — Worker cron triggers are free-tier; 24 KV writes/day is far
# under the 1k/day free cap. Deliberately NOT a container (Issue 045 T1:
# milliseconds of work per run; a container pays the $5 plan + uptime for
# nothing).
#
# Deploy (from this directory). Strip the API-token env vars: wrangler honours
# CF_API_TOKEN as a deprecated alias of CLOUDFLARE_API_TOKEN, so a shell that
# sourced .env authenticates as the analytics-scoped token — no workers_scripts
# write scope — and deploy fails auth error 10000. Measured 2026-08-28 on
# wrangler 4.127.1. The same applies to `secret put`, including the secret that
# shares the name. See README "The trap".
#   env -u CLOUDFLARE_API_TOKEN -u CF_API_TOKEN -u CLOUDFLARE_API_KEY \
#       -u CLOUDFLARE_EMAIL npx wrangler deploy
name = "riir-kat-housekeeping"
main = "src/worker.js"
compatibility_date = "2026-08-26"

# Every documented failure mode of this worker is SILENCE — the T8 key
# collision ran two days behind green checks, and the collectors degrade to an
# `ok:false` row nobody reads. Without this block the cron's own throws are
# invisible: the docs are explicit that you must add the observability setting
# for a Worker to write to Workers Logs. Cost is nil at this volume (24 cron
# runs/day against 20M logs/month included on Paid); `head_sampling_rate = 1`
# because sampling a 24-events-per-day signal defeats the point.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "HOUSEKEEPING_KV"
id = "a3a0add9325f4078a16e32eb26f54932"

[vars]
CF_ACCOUNT_ID = "7e11517c4dd4f6e9cede7da9b60d66eb"
# Pricing pinned 2026-08-26 (Issue 045) — Workers Paid, beyond included.
MEM_USD_PER_GIB_S = "0.0000025"
DISK_USD_PER_GB_S = "0.00000007"
CPU_USD_PER_S = "0.000020"
# Daily Workers-AI neuron cap (Issue 044 T4 budget alerting). Alert
# thresholds are 50% / 90% / 100% of this, once per threshold per day.
NEURON_CAP = "10000"
# CORS allowlist (comma-separated origins, no trailing slash). Defaults to the
# ops dashboard origin when unset.
ALLOWED_ORIGINS = "https://riir-ops-dashboard.foxfox.workers.dev"
