# riir-ops-dashboard — the Issue 044 ops dashboard (v2: worker + assets).
#
# Deployed with `npx wrangler deploy` from this directory after
# regenerating ../dashboard/index.html via
#   python3 ../../scripts/gen_dashboard.py
#
# v3 (Issue 044 T13): token-gated and FAILS CLOSED. src/worker.js runs FIRST
# on every request (run_worker_first) and serves the assets through the
# declared ASSETS binding (env.ASSETS). With DASHBOARD_TOKEN unset the worker
# returns 503 — it never serves the payload unauthenticated (T2's fail-open
# rationale of "aggregates only" was falsified by a payload audit; see
# src/worker.js). Authenticate once via ?token=… (301-exchanged for an
# HttpOnly cookie) or the cookie itself.
#   one-time:  npx wrangler secret put DASHBOARD_TOKEN
#
# STATE 2026-09-03 (Issue 065 T8): the secret is now SET, so the gate is CLOSED
# and every unauthenticated request answers 401. It had never been set since
# T13 armed this file, meaning the fail-open branch served the whole private
# payload to a bare `curl` for the entire time. Found by fetching the worker
# after a deploy rather than by reading the deploy's exit code. The remaining
# residual is that `UNCONFIGURED_POLICY` is still `serve`: DELETING the secret
# silently republishes the payload. Flipping it to `deny` (owner call, declined
# 2026-09-03 as too disruptive) is what makes that fail closed instead.
name = "riir-ops-dashboard"
compatibility_date = "2026-08-26"
main = "src/worker.js"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = true
# Explicit binding: with run_worker_first=true wrangler does NOT auto-add
# env.ASSETS — without this the worker's env.ASSETS.fetch() would be undefined.
binding = "ASSETS"

# CSP connect-src allowlist: the ONLY cross-origin call the HTML makes is the
# housekeeping worker's /latest live badge (T3). Keep in sync if that moves.
[vars]
HK_ORIGIN = "https://riir-kat-housekeeping.foxfox.workers.dev"
