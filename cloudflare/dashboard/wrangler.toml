# riir-ops-dashboard — the Issue 044 ops dashboard (v2: worker + assets).
#
# Deployed with `npx wrangler deploy` from this directory after
# regenerating ../dashboard/index.html via
#   python3 ../../scripts/gen_dashboard.py
#
# v2 (Issue 044 T2): token-gated when the DASHBOARD_TOKEN secret is set —
# one-time:   npx wrangler secret put DASHBOARD_TOKEN
# src/worker.js runs FIRST on every request (run_worker_first) and serves
# the assets through the declared ASSETS binding (env.ASSETS). Until the
# secret is set
# the worker FAILS OPEN (v1 behavior: aggregates-only HTML; response header
# x-dashboard-auth: open marks the mode). Authenticate once via
# ?token=… (exchanged for an HttpOnly cookie) or the cookie itself.
name = "riir-ops-dashboard"
compatibility_date = "2026-08-26"
main = "src/worker.js"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = true
# Explicit binding: with run_worker_first=true wrangler does NOT auto-add
# env.ASSETS — without this the worker's env.ASSETS.fetch() would be undefined.
binding = "ASSETS"
